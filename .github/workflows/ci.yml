name: CI

on:
  pull_request:
  # Test every merge on the live line (owner 2026-10-31, card vertex-ci-push-trigger).
  push:
    branches: [vertex/rebuild-darkfactory-20260921]
  workflow_dispatch:

concurrency:
  # PR runs share a group per PR; push runs on any branch other than the live line share
  # a group per branch. Both cancel the older run (owner 2026-11-01). Live-line push runs
  # and manual runs get their own group, so they are never cancelled or replaced.
  group: ${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/vertex/rebuild-darkfactory-20260921')) && format('run-{0}', github.run_id) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/vertex/rebuild-darkfactory-20260921') }}

permissions:
  contents: read

jobs:
  # A 2-vCPU runner cannot finish the 100% coverage run within the job limit,
  # so it runs in parallel shards. Each shard uploads a Vitest blob report; the
  # coverage lane below merges them and enforces the thresholds once.
  coverage-shards:
    name: Coverage shard (${{ matrix.shard }})
    # Public repository: GitHub-hosted runners only (owner rule, card vertex-public-audit).
    runs-on: ubuntu-latest
    # The acceptance clone reruns the whole unit suite (45-minute test limit).
    timeout-minutes: ${{ matrix.shard == 'acceptance' && 50 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        shard:
          ["1/12", "2/12", "3/12", "4/12", "5/12", "6/12", "7/12", "8/12", "9/12", "10/12", "11/12", "12/12", acceptance]
    env:
      APP_ENV: test
      # CI-only port so local dev databases on 55582 never collide with CI.
      VERTEX_POSTGRES_PORT: "55682"
      DATABASE_URL: postgresql://darkfactory_test_runner:darkfactory-test-only@127.0.0.1:55682/darkfactory_test_maintenance
      TEST_DATABASE_URL: postgresql://darkfactory_test_runner:darkfactory-test-only@127.0.0.1:55682/darkfactory_test_maintenance
      COVERAGE_SHARD: ${{ matrix.shard }}
      COVERAGE_REPORTS_DIR: .vitest-reports

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.16.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run coverage shard
        run: bun run verify:coverage

      - name: Upload coverage shard report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # One name per shard: a rerun of a failed shard replaces only its report.
          name: coverage-blob-${{ strategy.job-index }}
          overwrite: true
          path: .vitest-reports/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  verification:
    name: Verification (${{ matrix.lane }})
    # core, integration and browser do not use the shard reports, so they start
    # at once instead of waiting for every coverage shard. Only the coverage lane
    # (job verification-coverage below) waits for the shards.
    # PostgreSQL comes from scripts/ci/rig-postgres.sh (user-space binaries, no Docker).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane: [core, integration, browser]
        # Browser tests are off by owner order (2026-11-01, card browser-tests-pause)
        # until the blocked stack clears; offload is planned. The browser job is not
        # created unless the repository variable BROWSER_TESTS is "on". Spec files stay.
        exclude: ${{ fromJSON(vars.BROWSER_TESTS == 'on' && '[]' || '[{"lane":"browser"}]') }}
    # Keep CI infrastructure unprivileged and isolated from production credentials.
    env:
      APP_ENV: test

    steps:
      # CI-only ports (never 55582, the local dev DB). Each runner and lane gets its own
      # port, so parallel integration and browser lanes on two rig runners never collide.
      # The base is above the Linux ephemeral range (ip_local_port_range 32768-60999):
      # in that range an outgoing connection can take the port as its local port, which
      # `ss -l` does not show, and the server bind then fails (seen on 55682 and 55702).
      # rig-postgres.sh also moves up by 100 when the bind still fails.
      # Set through GITHUB_ENV only: a job-level env value would override it.
      - name: Choose PostgreSQL port
        shell: bash
        env:
          LANE: ${{ matrix.lane }}
        run: |
          case "${RUNNER_NAME}" in
            *-[0-9]*) runner="${RUNNER_NAME##*-}" ;;
            *) runner=0 ;;
          esac
          case "${LANE}" in
            integration) lane=0 ;;
            browser) lane=1 ;;
            *) lane=2 ;;
          esac
          port=$((61682 + 10 * runner + lane))
          # Another process on the rig (for example an agent's local compose database)
          # can hold this port. Move up in steps of 100 to a free one.
          for _ in 1 2 3 4 5; do
            [[ -z "$(ss -Hltn "sport = :${port}")" ]] && break
            echo "Port ${port} is in use; trying $((port + 100))."
            port=$((port + 100))
          done
          url="postgresql://darkfactory_test_runner:darkfactory-test-only@127.0.0.1:${port}/darkfactory_test_maintenance"
          {
            echo "VERTEX_POSTGRES_PORT=${port}"
            echo "DATABASE_URL=${url}"
            echo "TEST_DATABASE_URL=${url}"
          } >>"${GITHUB_ENV}"
          echo "PostgreSQL port for ${RUNNER_NAME}/${LANE}: ${port}"

      # The browser lane's HTTPS proxy defaulted to port 1356 on every runner, so a
      # concurrent browser lane (another rig runner, or another DarkFactory-based repo
      # on the same host) failed with "http://localhost:1356 is already used".
      # Each runner gets its own port; Playwright reads it for its webServer and baseURL.
      - name: Choose browser HTTPS port
        if: matrix.lane == 'browser'
        shell: bash
        run: |
          case "${RUNNER_NAME}" in
            *-[0-9]*) runner="${RUNNER_NAME##*-}" ;;
            *) runner=0 ;;
          esac
          port=$((21356 + 10 * runner))
          for _ in 1 2 3 4 5; do
            [[ -z "$(ss -Hltn "sport = :${port}")" ]] && break
            echo "Port ${port} is in use; trying $((port + 100))."
            port=$((port + 100))
          done
          echo "E2E_HTTPS_PORT=${port}" >>"${GITHUB_ENV}"
          echo "Browser HTTPS port for ${RUNNER_NAME}: ${port}"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A browser lane on a pull request diffs the merge commit against its first
          # parent (the base branch tip) to choose its specs.
          fetch-depth: ${{ (matrix.lane == 'browser' && github.event_name == 'pull_request') && 2 || 1 }}

      - name: Set up pnpm
        id: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.16.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        if: matrix.lane == 'browser'
        run: bunx --bun --no-install playwright install chromium

      # The browser lane starts its own PostgreSQL in its network namespace.
      - name: Start PostgreSQL integration service
        if: matrix.lane == 'integration'
        run: bash scripts/ci/rig-postgres.sh up

      - name: Master rules advisory pack
        if: matrix.lane == 'core'
        run: node --test research/master-rules/check-master-rules.mjs

      - name: Run verification lane
        if: matrix.lane != 'browser'
        run: bun run "verify:${{ matrix.lane }}"

      # The production build normally runs only in the browser lane (verify:browser).
      # While that lane is off (BROWSER_TESTS is not "on"), the core lane runs the build
      # so a build break still fails CI (card browser-tests-pause).
      - name: Production build (browser lane off)
        if: matrix.lane == 'core' && vars.BROWSER_TESTS != 'on'
        run: bun run build

      # Pull requests run the smoke spec plus the changed specs when every other changed
      # path is outside the app, the build and the suite (scripts/lib/browser-specs.ts).
      # Any other path, a git error, and every push or manual run use the full suite.
      - name: Choose browser specs
        if: matrix.lane == 'browser' && github.event_name == 'pull_request'
        shell: bash
        run: |
          specs="$(bun scripts/browser-specs.ts HEAD^1 HEAD)" || specs=""
          echo "BROWSER_SPECS=${specs}" >>"${GITHUB_ENV}"
          echo "Browser specs: ${specs:-full suite}"

      # Host network changes (Wi-Fi drops, Docker networks of other jobs) make Chromium
      # fail in-flight requests with ERR_NETWORK_CHANGED. The browser lane runs
      # verify:browser in a private network namespace with only loopback.
      - name: Run verification lane in a private network
        if: matrix.lane == 'browser'
        run: bash scripts/ci/browser-lane.sh

      # Playwright owns the HTTPS proxy and app server; keep evidence of failures only.
      - name: Upload Playwright failure evidence
        if: matrix.lane == 'browser' && failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop PostgreSQL integration service
        if: matrix.lane == 'integration' && always()
        run: bash scripts/ci/rig-postgres.sh down

  # The required "Verification (coverage)" check. It merges the shard reports and
  # enforces the coverage thresholds once, so it alone waits for the shards.
  verification-coverage:
    name: Verification (${{ matrix.lane }})
    needs: coverage-shards
    # Run even when a shard fails; the lane then fails on the check below.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        lane: [coverage]
    env:
      APP_ENV: test
      COVERAGE_MERGE_DIR: .vitest-reports

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.16.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require every coverage shard
        if: needs.coverage-shards.result != 'success'
        run: exit 1

      - name: Download coverage shard reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-blob-*
          path: .vitest-reports
          merge-multiple: true

      - name: Run verification lane
        run: bun run "verify:${{ matrix.lane }}"

  # The one required status check: it fails unless every coverage shard, every
  # verification lane and the coverage merge succeeded.
  ci-gate:
    name: ci-gate
    needs: [coverage-shards, verification, verification-coverage]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every lane
        shell: bash
        env:
          SHARDS: ${{ needs.coverage-shards.result }}
          VERIFICATION: ${{ needs.verification.result }}
          COVERAGE: ${{ needs.verification-coverage.result }}
        run: |
          echo "shards=${SHARDS} verification=${VERIFICATION} coverage=${COVERAGE}"
          [[ "${SHARDS}" == success && "${VERIFICATION}" == success && "${COVERAGE}" == success ]]
