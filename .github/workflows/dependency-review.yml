name: Dependency Review

on:
  pull_request:
    branches: [main, vertex/rebuild-darkfactory-20260921]

permissions: {}

jobs:
  dependency-review:
    name: Dependency Review
    # Public repositories always review. Private repositories opt in with the
    # DF_DEPENDENCY_REVIEW_ENABLED repository variable; an opted-in review that cannot run fails.
    if: ${{ !github.event.repository.private || vars.DF_DEPENDENCY_REVIEW_ENABLED == 'true' }}
    # GitHub-hosted runner (public repository; owner 2026-11-04).
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
