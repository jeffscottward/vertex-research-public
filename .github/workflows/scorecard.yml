name: OpenSSF Scorecard

on:
  branch_protection_rule:
  push:
    branches: [main, vertex/rebuild-darkfactory-20260921]
  schedule:
    - cron: "41 4 * * 1"

permissions: {}

jobs:
  scorecard:
    name: Scorecard analysis
    # Scorecard publishes public results only; private repositories skip it.
    if: ${{ !github.event.repository.private }}
    # This job keeps ubuntu-latest, as does the runner image canary (card
    # vertex-ci-runner-image-canary): the Scorecard
    # results API checks this job's label against its own list of Ubuntu labels, and the last
    # published list has no ubuntu-26.04. scripts/ci/workflow-invariants.test.ts lists it.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
