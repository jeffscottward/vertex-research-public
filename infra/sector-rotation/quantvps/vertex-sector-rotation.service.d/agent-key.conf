# Own operator write key for the sector rotation collection (card vertex-sector-rotation-two-schedulers,
# 2026-11-10). systemd reads this file after autopilot.env, so its VERTEX_AGENT_API_KEY replaces the
# shared Autopilot key; VERTEX_ORIGIN still comes from autopilot.env.
[Service]
EnvironmentFile=/etc/vertex-sector-rotation/agent-key.env
