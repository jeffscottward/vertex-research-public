# Drop-in for tailscaled.service on QuantVPS:
# /etc/systemd/system/tailscaled.service.d/10-vertex-preserve-runtime-dir.conf
# Installed by infra/quantvps/recreate-tailnet-proxies.sh and infra/quant-vps/status/install-tailnet.sh.
#
# The tailnet Caddy containers (vertex-web-tailnet, vertex-status-tailnet) bind-mount the directory
# /var/run/tailscale (= /run/tailscale). Without this setting systemd deletes that directory when
# tailscaled stops and creates a new one at start, so the containers keep the old, empty directory and
# every TLS handshake fails. With it, the directory stays; tailscaled re-creates only the socket inside
# it, and the containers see the new socket. A daemon-reload applies it; tailscaled needs no restart.
[Service]
RuntimeDirectoryPreserve=yes
