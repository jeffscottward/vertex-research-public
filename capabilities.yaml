project:
  name: Vertex Research
  slug: darkfactory
  version: 0.3.1
  framework_api: next-app-router
  framework_implementation: vinext
  build_tool: vite
  language: typescript
  runtime: cloudflare-workers

workspace:
  package_manager: pnpm
  script_runtime: bun
  orchestration: turborepo

deployment:
  web:
    provider: cloudflare
    deployer: "@vinext/cloudflare"
  ancillary_resources:
    provider: cloudflare
    infrastructure: alchemy
    enabled: false

database:
  engine: postgres
  orm: drizzle
  provider: postgres
  extensions_first: true

api:
  provider: orpc
  style: contract-first
  openapi: true

auth:
  provider: better-auth

ui:
  styling: tailwind
  components: shadcn
  typography: sans-serif
  public_reference: https://www.squarespace.com/
  portal_reference: https://ui.shadcn.com/blocks

ai:
  provider: groq

email:
  provider: resend
  local_transport: preview

analytics:
  provider: posthog
  adapter_required: true

telemetry:
  provider: opentelemetry

logging:
  provider: evlog

quality:
  formatter_linter: ultracite
  git_hooks: husky
  unit_tests: vitest
  browser_tests: playwright

developer_context:
  code_graph:
    provider: graphify
    enabled: true

examples:
  feature_stub:
    enabled: true
    removable: true
    generator_source: true

development:
  https:
    enabled: true
    provider: portless
    service_name: darkfactory
    canonical_url: https://darkfactory.localhost
    certificate_fallback: mkcert
    fallback_hostnames: [localhost, "*.localhost", 127.0.0.1, "::1"]
  seeded_accounts:
    enabled: true
    production_allowed: false
    users: [admin, alice, bob]

state:
  workflows: xstate
  client_local: zustand

# Declared, not installed/verified/available. Activation requires reviewed
# adapters and measured runtime evidence.
integrations:
  native_quant:
    provider: nautilus-trader
    enabled: false
    runtime_state: disabled
  research:
    provider: agno-vllm
    enabled: false
    runtime_state: disabled
  rust_kernel:
    provider: vertex-rust-kernel
    enabled: false
    runtime_state: disabled
  market_data:
    provider: quantdata-financialdatasets
    enabled: false
    runtime_state: disabled
  charts:
    provider: tanstack-charts-alpha
    enabled: false
    runtime_state: disabled
  notifications:
    provider: ntfy-resend
    enabled: false
    runtime_state: disabled
  browser_watch:
    provider: jev
    enabled: false
    runtime_state: disabled
