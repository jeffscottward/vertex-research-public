# gs-quant analytics lock: base research deps + gs-quant 2.2.4 (Goldman Sachs, Apache-2.0) + pytest.
# Only CPython 3.12 Linux x86_64 (manylinux_2_28 or older wheels).
# Resolved with: uv pip compile --generate-hashes --only-binary :all: --python-version 3.12
#   --python-platform x86_64-manylinux_2_28 (input: gs-quant==2.2.4 plus the pins of
#   requirements-linux-py312.lock), then reduced to the one cp312 / py3 Linux x86_64 wheel per pin
#   (pip download --only-binary=:all: --platform manylinux_2_28_x86_64 ... --abi cp312).
# Base pins and hashes are identical to requirements-linux-py312.lock. Pins that equal a pin of
# requirements-nautilus-linux-py312.lock (numpy 2.5.4 and others) have the same hash; pandas differs
# (3.1.1 here, 2.3.3 there), so the two locks are separate environments.
# gs-quant is used as a pinned dependency only, never vendored. Only the offline part is used
# (analytics/gs_quant_backend.py); no Goldman Sachs Marquee session or credential is involved.
# Install: python -m pip install --no-deps --require-hashes --only-binary=:all: -r requirements-gsquant-linux-py312.lock
