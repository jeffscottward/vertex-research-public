[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "vertex-openbb"
version = "0.1.0"
description = "Vertex OpenBB fetcher: public Cboe, CFTC, Fed, Treasury, OECD, FRED, FINRA, SEC and Fama-French data as openbb-batch.v1 JSON on stdout (research only)"
requires-python = ">=3.12,<3.13"
license = { text = "MIT; uses OpenBB Platform (Apache-2.0), see NOTICE" }
# Pins of requirements-openbb.in. Install the hash-locked closure first
# (requirements-openbb-linux-py312.lock), then this package with --no-deps.
dependencies = [
  "openbb-core==2.0.1",
  "openbb-cboe==2.0.0",
  "openbb-cftc==2.0.0",
  "openbb-famafrench==2.0.0",
  "openbb-federal-reserve==2.0.0",
  "openbb-finra==2.0.0",
  "openbb-government-us==2.0.0",
  "openbb-oecd==2.0.0",
  "openbb-sec==2.0.0",
]

[project.optional-dependencies]
test = ["pytest==9.0.3"]

[project.scripts]
vertex-openbb = "vertex_openbb.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vertex_openbb", "vertex_openbb.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
