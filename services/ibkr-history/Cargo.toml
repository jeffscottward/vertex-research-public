[package]
name = "vertex-ibkr-history"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
ibapi = { path = "vendor/ibapi-3.3.0", version = "=3.3.0", default-features = false, features = ["async"] }
base64 = "0.22"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = "0.3"
tokio = { version = "1", features = ["sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }

[package.metadata.vertex]
state = "source-only-not-compiled-or-runtime-qualified"
owner-mount = "opt-in-same-image-source-patch-not-built-or-activated"
nautilus-intended-version = "2.0.0rc5"
ibapi-crate-checksum = "fc5651f11bacdf138a1a910dc075c21e425912ff767e7f3e237b9fe14d9f3f76"
activation = "none"
