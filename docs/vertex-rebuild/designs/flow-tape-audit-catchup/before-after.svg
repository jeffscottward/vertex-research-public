<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="640"
  viewBox="0 0 1200 640"
  font-family="Manrope, 'Public Sans', sans-serif"
>
  <title>
    MOCK. Before: a collector outage longer than the 10-minute look-back loses
    the cut minutes, and the tape coverage is not checked against a second
    source. After: the cut minutes are stored as gaps and read back from the
    ring, oldest first, 10 minutes per run; every 5 minutes the newest IBKR
    history prints are compared with the tape second by second.
  </title>
  <rect width="1200" height="640" fill="#0f1115" />
  <text
    x="600"
    y="44"
    fill="#f4f1e8"
    font-size="26"
    font-weight="700"
    text-anchor="middle"
  >
    Streamed ES/NQ tape: IBKR history check + outage catch-up
  </text>
  <text
    x="1170"
    y="44"
    fill="#c9a227"
    font-size="16"
    font-weight="700"
    text-anchor="end"
  >
    MOCK
  </text>

  <!-- column headers -->
  <rect
    x="30"
    y="70"
    width="555"
    height="545"
    rx="16"
    fill="#171a21"
    stroke="#2c313c"
  />
  <rect
    x="615"
    y="70"
    width="555"
    height="545"
    rx="16"
    fill="#171a21"
    stroke="#c9a227"
  />
  <text
    x="307"
    y="106"
    fill="#9aa3b2"
    font-size="22"
    font-weight="700"
    text-anchor="middle"
  >
    BEFORE
  </text>
  <text
    x="892"
    y="106"
    fill="#c9a227"
    font-size="22"
    font-weight="700"
    text-anchor="middle"
  >
    AFTER
  </text>

  <!-- BEFORE: outage timeline -->
  <text x="60" y="150" fill="#f4f1e8" font-size="16" font-weight="600">
    Collector down 40 min
  </text>
  <g transform="translate(60,165)">
    <rect x="0" y="0" width="480" height="34" rx="6" fill="#232834" />
    <rect x="0" y="0" width="80" height="34" rx="6" fill="#3d8b5a" />
    <rect x="80" y="0" width="300" height="34" fill="#5a2a2a" />
    <rect x="380" y="0" width="100" height="34" rx="6" fill="#3d8b5a" />
    <text x="230" y="23" fill="#ffb4b4" font-size="15" text-anchor="middle">
      30 min lost for good
    </text>
    <text
      x="430"
      y="23"
      fill="#0f1115"
      font-size="13"
      text-anchor="middle"
      font-weight="700"
    >
      live read
    </text>
  </g>
  <!-- ring icon -->
  <g transform="translate(110,250)">
    <circle
      cx="40"
      cy="40"
      r="34"
      fill="none"
      stroke="#6b7385"
      stroke-width="10"
      stroke-dasharray="14 6"
    />
    <text x="40" y="46" fill="#9aa3b2" font-size="14" text-anchor="middle">
      ring
    </text>
    <text x="100" y="34" fill="#9aa3b2" font-size="15">
      still holds the minutes,
    </text>
    <text x="100" y="56" fill="#9aa3b2" font-size="15">
      but nobody reads them back
    </text>
  </g>
  <!-- no second source -->
  <text x="60" y="380" fill="#f4f1e8" font-size="16" font-weight="600">
    Coverage vs. a second source
  </text>
  <g transform="translate(60,395)">
    <rect x="0" y="0" width="200" height="80" rx="10" fill="#232834" />
    <text x="100" y="34" fill="#c9cfdb" font-size="15" text-anchor="middle">
      tape (stream)
    </text>
    <text x="100" y="58" fill="#6b7385" font-size="13" text-anchor="middle">
      covered seconds only
    </text>
    <text
      x="250"
      y="52"
      fill="#ff6b6b"
      font-size="40"
      font-weight="700"
      text-anchor="middle"
    >
      ?
    </text>
    <rect
      x="300"
      y="0"
      width="180"
      height="80"
      rx="10"
      fill="#1b1e25"
      stroke="#3a3f4b"
      stroke-dasharray="6 5"
    />
    <text x="390" y="46" fill="#6b7385" font-size="15" text-anchor="middle">
      no check
    </text>
  </g>
  <text x="60" y="530" fill="#9aa3b2" font-size="15">
    Page: "not checked against a second source"
  </text>
  <text x="60" y="556" fill="#9aa3b2" font-size="15">
    16:58 and 16:59 before the CME break: never stored
  </text>

  <!-- AFTER: catch-up timeline -->
  <text x="645" y="150" fill="#f4f1e8" font-size="16" font-weight="600">
    Gap rows, read back oldest first, 10 min per run
  </text>
  <g transform="translate(645,165)">
    <rect x="0" y="0" width="480" height="34" rx="6" fill="#232834" />
    <rect x="0" y="0" width="80" height="34" rx="6" fill="#3d8b5a" />
    <rect x="80" y="0" width="100" height="34" fill="#c9a227" />
    <rect x="180" y="0" width="100" height="34" fill="#c9a227" opacity="0.75" />
    <rect x="280" y="0" width="100" height="34" fill="#c9a227" opacity="0.5" />
    <rect x="380" y="0" width="100" height="34" rx="6" fill="#3d8b5a" />
    <text
      x="130"
      y="23"
      fill="#0f1115"
      font-size="13"
      text-anchor="middle"
      font-weight="700"
    >
      run 1
    </text>
    <text
      x="230"
      y="23"
      fill="#0f1115"
      font-size="13"
      text-anchor="middle"
      font-weight="700"
    >
      run 2
    </text>
    <text
      x="330"
      y="23"
      fill="#0f1115"
      font-size="13"
      text-anchor="middle"
      font-weight="700"
    >
      run 3
    </text>
    <text
      x="430"
      y="23"
      fill="#0f1115"
      font-size="13"
      text-anchor="middle"
      font-weight="700"
    >
      live read
    </text>
  </g>
  <g transform="translate(695,250)">
    <circle
      cx="40"
      cy="40"
      r="34"
      fill="none"
      stroke="#c9a227"
      stroke-width="10"
      stroke-dasharray="14 6"
    />
    <text x="40" y="46" fill="#f4f1e8" font-size="14" text-anchor="middle">
      ring
    </text>
    <path
      d="M84 40 H150"
      stroke="#c9a227"
      stroke-width="4"
      marker-end="url(#arrow)"
    />
    <rect x="156" y="14" width="140" height="52" rx="8" fill="#232834" />
    <text x="226" y="46" fill="#f4f1e8" font-size="15" text-anchor="middle">
      flow_minutes
    </text>
    <text x="310" y="34" fill="#9aa3b2" font-size="13">
      minutes the ring lost:
    </text>
    <text x="310" y="54" fill="#9aa3b2" font-size="13">
      "N min not in the ring"
    </text>
  </g>
  <defs>
    <marker
      id="arrow"
      markerWidth="10"
      markerHeight="10"
      refX="6"
      refY="5"
      orient="auto"
    >
      <path d="M0,0 L10,5 L0,10 z" fill="#c9a227" />
    </marker>
  </defs>
  <!-- history check -->
  <text x="645" y="380" fill="#f4f1e8" font-size="16" font-weight="600">
    Every 5 min: newest IBKR history vs. tape, per second
  </text>
  <g transform="translate(645,395)">
    <text x="0" y="16" fill="#9aa3b2" font-size="13">history</text>
    <text x="0" y="66" fill="#9aa3b2" font-size="13">tape</text>
    <g fill="#5b8def">
      <rect x="70" y="4" width="22" height="18" />
      <rect x="100" y="0" width="22" height="22" />
      <rect x="130" y="10" width="22" height="12" />
      <rect x="160" y="2" width="22" height="20" />
      <rect x="190" y="6" width="22" height="16" />
      <rect x="220" y="0" width="22" height="22" />
      <rect x="250" y="8" width="22" height="14" />
    </g>
    <g fill="#c9a227">
      <rect x="70" y="54" width="22" height="18" />
      <rect x="100" y="50" width="22" height="22" />
      <rect x="130" y="60" width="22" height="12" />
      <rect x="160" y="52" width="22" height="20" />
      <rect x="190" y="62" width="22" height="10" />
      <rect x="220" y="50" width="22" height="22" />
      <rect x="250" y="58" width="22" height="14" />
    </g>
    <g font-size="16" text-anchor="middle" font-weight="700">
      <text x="81" y="44" fill="#3dd68c">✓</text>
      <text x="111" y="44" fill="#3dd68c">✓</text>
      <text x="141" y="44" fill="#3dd68c">✓</text>
      <text x="171" y="44" fill="#3dd68c">✓</text>
      <text x="201" y="44" fill="#ff6b6b">✗</text>
      <text x="231" y="44" fill="#3dd68c">✓</text>
      <text x="261" y="44" fill="#3dd68c">✓</text>
    </g>
    <rect x="300" y="12" width="180" height="56" rx="10" fill="#232834" />
    <text x="390" y="38" fill="#f4f1e8" font-size="15" text-anchor="middle">
      6 of 7 s match
    </text>
    <text x="390" y="58" fill="#9aa3b2" font-size="12" text-anchor="middle">
      → flow_tape_audits
    </text>
  </g>
  <text x="645" y="530" fill="#f4f1e8" font-size="15">
    Page: "IBKR history check: 412 of 415 compared
  </text>
  <text x="645" y="552" fill="#f4f1e8" font-size="15">
    seconds match (99%) in 14 checks this session."
  </text>
  <text x="645" y="584" fill="#9aa3b2" font-size="13">
    1 IBKR request per 5 min per symbol, only at ≤ 2 of 6 recent requests
  </text>
</svg>
