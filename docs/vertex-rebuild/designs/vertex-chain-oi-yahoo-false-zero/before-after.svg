<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="840"
  viewBox="0 0 1200 840"
  role="img"
  aria-label="Before and after: options chain open interest when Yahoo Finance reports 0"
>
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#f87171" />
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#34d399" />
    </marker>
    <marker id="arr-gold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#f5c451" />
    </marker>
    <marker id="arr-muted" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#9ca3af" />
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="840" fill="#0b0f17" />

  <!-- Title -->
  <text x="40" y="48" fill="#f3f4f6" font-family="sans-serif" font-size="25" font-weight="700">
    Options chain OI: drop Yahoo false 0, fall back to Nasdaq, then Quant Data
  </text>
  <text x="40" y="74" fill="#9ca3af" font-family="sans-serif" font-size="14">
    Live check 5 on SPY &amp; NVDA (2026-11-27, 63 contracts with flow): 28 of 28 Yahoo zeros had real Nasdaq OI
  </text>

  <!-- ==================== TOP LEFT: BEFORE FLOW ==================== -->
  <rect x="40" y="98" width="545" height="332" rx="12" fill="#111827" stroke="#7f1d1d" stroke-width="1.5" />
  <rect x="40" y="98" width="545" height="36" rx="12" fill="#2a1215" />
  <rect x="40" y="122" width="545" height="12" fill="#2a1215" />
  <circle cx="62" cy="116" r="6" fill="#f87171" />
  <text x="78" y="121" fill="#fecaca" font-family="sans-serif" font-size="15" font-weight="700">
    BEFORE (PR #461) — Yahoo 0 accepted as real
  </text>

  <!-- Yahoo node -->
  <rect x="64" y="162" width="142" height="62" rx="8" fill="#1f2937" stroke="#f87171" stroke-width="1.5" />
  <text x="135" y="186" text-anchor="middle" fill="#e5e7eb" font-family="sans-serif" font-size="13" font-weight="700">Yahoo Finance</text>
  <text x="135" y="208" text-anchor="middle" fill="#f87171" font-family="monospace" font-size="15" font-weight="700">OI = 0</text>

  <!-- Arrow Yahoo -> Merge -->
  <line x1="206" y1="193" x2="256" y2="230" stroke="#f87171" stroke-width="2.5" marker-end="url(#arr-red)" />
  <text x="224" y="196" fill="#f87171" font-family="sans-serif" font-size="11" font-weight="700">wins</text>

  <!-- Quant Data node -->
  <rect x="64" y="246" width="142" height="58" rx="8" fill="#1f2937" stroke="#4b5563" stroke-width="1" />
  <text x="135" y="269" text-anchor="middle" fill="#9ca3af" font-family="sans-serif" font-size="13" font-weight="700">Quant Data print</text>
  <text x="135" y="290" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="13">0 (dropped) / stale</text>
  <line x1="206" y1="275" x2="256" y2="252" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr-muted)" />

  <!-- Nasdaq unused node -->
  <rect x="64" y="324" width="142" height="58" rx="8" fill="#131a26" stroke="#374151" stroke-width="1" stroke-dasharray="5,4" />
  <text x="135" y="347" text-anchor="middle" fill="#6b7280" font-family="sans-serif" font-size="13" font-weight="700">Nasdaq (not wired)</text>
  <text x="135" y="368" text-anchor="middle" fill="#6b7280" font-family="monospace" font-size="13">79,198 / 21,685</text>

  <!-- Merge node -->
  <rect x="262" y="210" width="114" height="66" rx="8" fill="#1f2937" stroke="#6b7280" stroke-width="1.5" />
  <text x="319" y="238" text-anchor="middle" fill="#e5e7eb" font-family="sans-serif" font-size="13" font-weight="700">Merge</text>
  <text x="319" y="258" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="11">yahoo &gt; qd</text>

  <!-- Arrow Merge -> UI -->
  <line x1="376" y1="243" x2="416" y2="243" stroke="#f87171" stroke-width="2.5" marker-end="url(#arr-red)" />

  <!-- Chain cell BEFORE -->
  <rect x="422" y="198" width="140" height="90" rx="10" fill="#2a1215" stroke="#f87171" stroke-width="2" />
  <text x="492" y="222" text-anchor="middle" fill="#fca5a5" font-family="sans-serif" font-size="12" font-weight="700">SHOWN IN CHAIN</text>
  <text x="492" y="256" text-anchor="middle" fill="#f87171" font-family="monospace" font-size="28" font-weight="700">0</text>
  <text x="492" y="276" text-anchor="middle" fill="#fca5a5" font-family="sans-serif" font-size="11">src: yahoo · false 0</text>

  <!-- Status pill -->
  <rect x="262" y="346" width="300" height="34" rx="6" fill="#2a1215" />
  <text x="412" y="368" text-anchor="middle" fill="#fca5a5" font-family="sans-serif" font-size="12" font-weight="700">
    28 / 28 Yahoo zeros wrong · P/C OI distorted
  </text>

  <!-- ==================== TOP RIGHT: AFTER FLOW ==================== -->
  <rect x="615" y="98" width="545" height="332" rx="12" fill="#111827" stroke="#065f46" stroke-width="1.5" />
  <rect x="615" y="98" width="545" height="36" rx="12" fill="#0d2922" />
  <rect x="615" y="122" width="545" height="12" fill="#0d2922" />
  <circle cx="637" cy="116" r="6" fill="#34d399" />
  <text x="653" y="121" fill="#a7f3d0" font-family="sans-serif" font-size="15" font-weight="700">
    AFTER — Yahoo &lt; 1 unreported; conditional Nasdaq fallback
  </text>

  <!-- Yahoo node -->
  <rect x="639" y="156" width="142" height="58" rx="8" fill="#1f2937" stroke="#6b7280" stroke-width="1.5" />
  <text x="710" y="179" text-anchor="middle" fill="#e5e7eb" font-family="sans-serif" font-size="13" font-weight="700">1. Yahoo Finance</text>
  <text x="710" y="199" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="12">OI &lt; 1 → null</text>
  <line x1="781" y1="185" x2="831" y2="225" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr-muted)" />

  <!-- Nasdaq node -->
  <rect x="639" y="232" width="142" height="62" rx="8" fill="#1f2937" stroke="#f5c451" stroke-width="2" />
  <text x="710" y="256" text-anchor="middle" fill="#fde68a" font-family="sans-serif" font-size="13" font-weight="700">2. Nasdaq (if gap)</text>
  <text x="710" y="278" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="14" font-weight="700">79,198 / 21,685</text>
  <line x1="781" y1="263" x2="831" y2="248" stroke="#34d399" stroke-width="2.5" marker-end="url(#arr-green)" />

  <!-- Quant Data node -->
  <rect x="639" y="312" width="142" height="54" rx="8" fill="#1f2937" stroke="#4b5563" stroke-width="1" />
  <text x="710" y="334" text-anchor="middle" fill="#9ca3af" font-family="sans-serif" font-size="13" font-weight="700">3. Quant Data</text>
  <text x="710" y="353" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="12">print OI &gt;= 1 only</text>
  <line x1="781" y1="339" x2="831" y2="265" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr-muted)" />

  <!-- Merge node -->
  <rect x="837" y="206" width="114" height="72" rx="8" fill="#1f2937" stroke="#34d399" stroke-width="1.5" />
  <text x="894" y="232" text-anchor="middle" fill="#e5e7eb" font-family="sans-serif" font-size="13" font-weight="700">Merge</text>
  <text x="894" y="250" text-anchor="middle" fill="#a7f3d0" font-family="monospace" font-size="10">yahoo &gt; nasdaq</text>
  <text x="894" y="264" text-anchor="middle" fill="#a7f3d0" font-family="monospace" font-size="10">&gt; quantdata</text>

  <!-- Arrow Merge -> UI -->
  <line x1="951" y1="242" x2="991" y2="242" stroke="#34d399" stroke-width="2.5" marker-end="url(#arr-green)" />

  <!-- Chain cell AFTER -->
  <rect x="997" y="180" width="142" height="106" rx="10" fill="#0d2922" stroke="#34d399" stroke-width="2" />
  <text x="1068" y="203" text-anchor="middle" fill="#a7f3d0" font-family="sans-serif" font-size="12" font-weight="700">SHOWN IN CHAIN</text>
  <text x="1068" y="236" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="24" font-weight="700">79,198</text>
  <text x="1068" y="256" text-anchor="middle" fill="#fde68a" font-family="sans-serif" font-size="11">src: nasdaq</text>
  <text x="1068" y="274" text-anchor="middle" fill="#9ca3af" font-family="sans-serif" font-size="10">or "no OI" if none &gt;= 1</text>

  <!-- Conditional badge -->
  <rect x="837" y="346" width="302" height="34" rx="6" fill="#0d2922" />
  <text x="988" y="368" text-anchor="middle" fill="#a7f3d0" font-family="sans-serif" font-size="12" font-weight="700">
    0 false zeros · Nasdaq off when Yahoo has no gaps
  </text>

  <!-- ==================== BOTTOM: VERIFIED DATA CHART ==================== -->
  <rect x="40" y="454" width="1120" height="352" rx="12" fill="#111827" stroke="#1f2937" stroke-width="1.5" />
  <text x="64" y="486" fill="#f3f4f6" font-family="sans-serif" font-size="16" font-weight="700">
    Live check 5 measurements (2026-11-27, SPY &amp; NVDA, 63 contracts with flow)
  </text>

  <!-- Left half: 63 contracts stacked proportion bar -->
  <text x="64" y="520" fill="#d1d5db" font-family="sans-serif" font-size="13" font-weight="700">
    63 flow contracts: OI accuracy vs Nasdaq
  </text>

  <!-- BEFORE stacked bar -->
  <text x="64" y="556" fill="#fca5a5" font-family="sans-serif" font-size="12" font-weight="700">BEFORE</text>
  <!-- 35/63 = 55.5% of 420px = 233px -->
  <rect x="132" y="538" width="233" height="30" rx="4" fill="#10b981" />
  <text x="248" y="558" text-anchor="middle" fill="#052e16" font-family="sans-serif" font-size="12" font-weight="700">35 matched (Yahoo &gt; 0)</text>
  <!-- 28/63 = 44.4% of 420px = 187px -->
  <rect x="367" y="538" width="185" height="30" rx="4" fill="#ef4444" />
  <text x="459" y="558" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="12" font-weight="700">28 false 0 (FAIL)</text>

  <!-- AFTER stacked bar -->
  <text x="64" y="608" fill="#a7f3d0" font-family="sans-serif" font-size="12" font-weight="700">AFTER</text>
  <rect x="132" y="590" width="233" height="30" rx="4" fill="#10b981" />
  <text x="248" y="610" text-anchor="middle" fill="#052e16" font-family="sans-serif" font-size="12" font-weight="700">35 Yahoo (&gt; 0)</text>
  <rect x="367" y="590" width="185" height="30" rx="4" fill="#f5c451" />
  <text x="459" y="610" text-anchor="middle" fill="#1f1400" font-family="sans-serif" font-size="12" font-weight="700">28 Nasdaq fallback</text>

  <!-- Legend / summary stats -->
  <rect x="64" y="646" width="488" height="132" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <text x="82" y="672" fill="#e5e7eb" font-family="sans-serif" font-size="13" font-weight="700">
    Live Nasdaq API probe (2026-11-27 22:21 UTC)
  </text>
  <circle cx="88" cy="696" r="4" fill="#34d399" />
  <text x="102" y="700" fill="#d1d5db" font-family="sans-serif" font-size="12">
    SPY, NVDA, IWM, BRK.B: HTTP 200 · 0 "0" strings across 1,056 strikes
  </text>
  <circle cx="88" cy="722" r="4" fill="#f5c451" />
  <text x="102" y="726" fill="#d1d5db" font-family="sans-serif" font-size="12">
    Missing OI returned as "--" (368 legs) → mapped to null ("no OI")
  </text>
  <circle cx="88" cy="748" r="4" fill="#f87171" />
  <text x="102" y="752" fill="#d1d5db" font-family="sans-serif" font-size="12">
    CBOE delayed-quotes CDN tested: HTTP 403 (rejected)
  </text>

  <!-- Vertical divider -->
  <line x1="588" y1="504" x2="588" y2="784" stroke="#1f2937" stroke-width="1.5" />

  <!-- Right half: Named near-the-money contracts bar chart -->
  <text x="616" y="520" fill="#d1d5db" font-family="sans-serif" font-size="13" font-weight="700">
    Examples near the money: shown OI before vs after
  </text>

  <!-- Scale max = 80,000 -> width = 440px -->
  <!-- Gridlines -->
  <line x1="696" y1="542" x2="696" y2="740" stroke="#374151" stroke-width="1" />
  <line x1="806" y1="542" x2="806" y2="740" stroke="#1f2937" stroke-width="1" stroke-dasharray="3,3" />
  <line x1="916" y1="542" x2="916" y2="740" stroke="#1f2937" stroke-width="1" stroke-dasharray="3,3" />
  <line x1="1026" y1="542" x2="1026" y2="740" stroke="#1f2937" stroke-width="1" stroke-dasharray="3,3" />
  <line x1="1136" y1="542" x2="1136" y2="740" stroke="#1f2937" stroke-width="1" stroke-dasharray="3,3" />

  <text x="696" y="758" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="11">0</text>
  <text x="806" y="758" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="11">20k</text>
  <text x="916" y="758" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="11">40k</text>
  <text x="1026" y="758" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="11">60k</text>
  <text x="1136" y="758" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="11">80k</text>

  <!-- Contract 1: NVDA 2027-01-15 160C (79,198 -> 435.6px) -->
  <text x="616" y="566" fill="#e5e7eb" font-family="sans-serif" font-size="12" font-weight="700">NVDA 160C</text>
  <text x="616" y="582" fill="#9ca3af" font-family="monospace" font-size="10">2027-01-15</text>
  <!-- Before = 0 -->
  <rect x="696" y="552" width="4" height="14" rx="2" fill="#ef4444" />
  <text x="708" y="563" fill="#fca5a5" font-family="monospace" font-size="11">0 (before · Yahoo)</text>
  <!-- After = 79,198 -->
  <rect x="696" y="572" width="435" height="22" rx="4" fill="#f5c451" />
  <text x="1124" y="587" text-anchor="end" fill="#1f1400" font-family="monospace" font-size="12" font-weight="700">79,198 (after · Nasdaq)</text>

  <!-- Contract 2: SPY 2026-12-04 700P (21,685 -> 119.3px) -->
  <text x="616" y="654" fill="#e5e7eb" font-family="sans-serif" font-size="12" font-weight="700">SPY 700P</text>
  <text x="616" y="670" fill="#9ca3af" font-family="monospace" font-size="10">2026-12-04</text>
  <!-- Before = 0 -->
  <rect x="696" y="640" width="4" height="14" rx="2" fill="#ef4444" />
  <text x="708" y="651" fill="#fca5a5" font-family="monospace" font-size="11">0 (before · Yahoo)</text>
  <!-- After = 21,685 -->
  <rect x="696" y="660" width="119" height="22" rx="4" fill="#f5c451" />
  <text x="823" y="675" fill="#fde68a" font-family="monospace" font-size="12" font-weight="700">21,685 (after · Nasdaq)</text>

  <!-- Footer caption -->
  <text x="616" y="782" fill="#9ca3af" font-family="sans-serif" font-size="11">
    No mock data: all counts verified against live check 5 and Nasdaq option-chain API (2026-11-27).
  </text>
</svg>
