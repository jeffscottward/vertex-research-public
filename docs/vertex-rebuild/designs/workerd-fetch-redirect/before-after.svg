<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="560"
  viewBox="0 0 1200 560"
  font-family="Public Sans, DejaVu Sans, sans-serif"
>
  <title>
    Before and after: server fetch with redirect "error" in workerd, and the fix
    with redirect "manual" plus a CI guard
  </title>
  <rect width="1200" height="560" fill="#111214" />
  <text
    x="600"
    y="44"
    fill="#f2f2f2"
    font-size="26"
    font-weight="700"
    text-anchor="middle"
  >
    Server fetch in workerd (vertex-web on QuantVPS)
  </text>

  <!-- BEFORE -->
  <text x="40" y="100" fill="#e0b84f" font-size="22" font-weight="700">
    BEFORE
  </text>
  <text x="140" y="100" fill="#9a9a9a" font-size="18">redirect: "error"</text>
  <!-- server icon -->
  <g transform="translate(60,130)">
    <rect
      width="120"
      height="120"
      rx="14"
      fill="#1d1f23"
      stroke="#5b5f66"
      stroke-width="2"
    />
    <rect x="20" y="22" width="80" height="16" rx="4" fill="#3a3e45" />
    <rect x="20" y="52" width="80" height="16" rx="4" fill="#3a3e45" />
    <rect x="20" y="82" width="80" height="16" rx="4" fill="#3a3e45" />
    <circle cx="90" cy="30" r="4" fill="#e0b84f" />
    <circle cx="90" cy="60" r="4" fill="#e0b84f" />
    <circle cx="90" cy="90" r="4" fill="#e0b84f" />
    <text x="60" y="146" fill="#cfcfcf" font-size="16" text-anchor="middle">
      vertex-web
    </text>
  </g>
  <!-- arrow stopped -->
  <line
    x1="200"
    y1="190"
    x2="330"
    y2="190"
    stroke="#e05252"
    stroke-width="5"
    stroke-dasharray="10 8"
  />
  <g transform="translate(330,160)">
    <circle
      cx="30"
      cy="30"
      r="30"
      fill="#3a1717"
      stroke="#e05252"
      stroke-width="4"
    />
    <line
      x1="17"
      y1="17"
      x2="43"
      y2="43"
      stroke="#e05252"
      stroke-width="6"
      stroke-linecap="round"
    />
    <line
      x1="43"
      y1="17"
      x2="17"
      y2="43"
      stroke="#e05252"
      stroke-width="6"
      stroke-linecap="round"
    />
  </g>
  <text x="360" y="250" fill="#e05252" font-size="15" text-anchor="middle">
    TypeError
  </text>
  <text x="360" y="270" fill="#9a9a9a" font-size="14" text-anchor="middle">
    no request sent
  </text>
  <!-- provider icons greyed -->
  <g transform="translate(450,120)" opacity="0.45">
    <rect width="96" height="44" rx="10" fill="#26292e" stroke="#5b5f66" />
    <text x="48" y="28" fill="#cfcfcf" font-size="15" text-anchor="middle">
      Nasdaq OI
    </text>
    <rect
      y="54"
      width="96"
      height="44"
      rx="10"
      fill="#26292e"
      stroke="#5b5f66"
    />
    <text x="48" y="82" fill="#cfcfcf" font-size="15" text-anchor="middle">
      Swinglytics
    </text>
    <rect
      y="108"
      width="96"
      height="44"
      rx="10"
      fill="#26292e"
      stroke="#5b5f66"
    />
    <text x="48" y="136" fill="#cfcfcf" font-size="15" text-anchor="middle">
      PostHog
    </text>
  </g>
  <g transform="translate(560,120)" opacity="0.45">
    <rect width="96" height="44" rx="10" fill="#26292e" stroke="#5b5f66" />
    <text x="48" y="28" fill="#cfcfcf" font-size="15" text-anchor="middle">
      Resend
    </text>
    <rect
      y="54"
      width="96"
      height="44"
      rx="10"
      fill="#26292e"
      stroke="#5b5f66"
    />
    <text x="48" y="82" fill="#cfcfcf" font-size="15" text-anchor="middle">
      ntfy
    </text>
  </g>
  <!-- chain table icon with blanks -->
  <g transform="translate(720,120)">
    <rect
      width="200"
      height="150"
      rx="12"
      fill="#1d1f23"
      stroke="#5b5f66"
      stroke-width="2"
    />
    <text x="100" y="26" fill="#cfcfcf" font-size="15" text-anchor="middle">
      Options chain OI
    </text>
    <text x="30" y="58" fill="#cfcfcf" font-size="15">725C</text>
    <text x="170" y="58" fill="#e05252" font-size="15" text-anchor="end">
      —
    </text>
    <text x="30" y="86" fill="#cfcfcf" font-size="15">700P</text>
    <text x="170" y="86" fill="#e05252" font-size="15" text-anchor="end">
      —
    </text>
    <text x="30" y="114" fill="#cfcfcf" font-size="15">150C</text>
    <text x="170" y="114" fill="#e05252" font-size="15" text-anchor="end">
      —
    </text>
    <text x="100" y="140" fill="#9a9a9a" font-size="13" text-anchor="middle">
      Nasdaq: "could not be reached"
    </text>
  </g>
  <g transform="translate(960,130)">
    <rect
      width="200"
      height="130"
      rx="12"
      fill="#2a1616"
      stroke="#e05252"
      stroke-width="2"
    />
    <text
      x="100"
      y="40"
      fill="#e05252"
      font-size="22"
      font-weight="700"
      text-anchor="middle"
    >
      7 of 64
    </text>
    <text x="100" y="66" fill="#cfcfcf" font-size="14" text-anchor="middle">
      contracts: no OI shown,
    </text>
    <text x="100" y="86" fill="#cfcfcf" font-size="14" text-anchor="middle">
      Nasdaq has OI
    </text>
    <text x="100" y="114" fill="#9a9a9a" font-size="13" text-anchor="middle">
      live check A: fail
    </text>
  </g>

  <line x1="40" y1="310" x2="1160" y2="310" stroke="#2c2f34" stroke-width="2" />

  <!-- AFTER -->
  <text x="40" y="356" fill="#e0b84f" font-size="22" font-weight="700">
    AFTER
  </text>
  <text x="130" y="356" fill="#9a9a9a" font-size="18">
    redirect: "manual" + CI guard
  </text>
  <g transform="translate(60,386)">
    <rect
      width="120"
      height="120"
      rx="14"
      fill="#1d1f23"
      stroke="#5b5f66"
      stroke-width="2"
    />
    <rect x="20" y="22" width="80" height="16" rx="4" fill="#3a3e45" />
    <rect x="20" y="52" width="80" height="16" rx="4" fill="#3a3e45" />
    <rect x="20" y="82" width="80" height="16" rx="4" fill="#3a3e45" />
    <circle cx="90" cy="30" r="4" fill="#4fbf7a" />
    <circle cx="90" cy="60" r="4" fill="#4fbf7a" />
    <circle cx="90" cy="90" r="4" fill="#4fbf7a" />
    <text x="60" y="146" fill="#cfcfcf" font-size="16" text-anchor="middle">
      vertex-web
    </text>
  </g>
  <line x1="200" y1="446" x2="430" y2="446" stroke="#4fbf7a" stroke-width="5" />
  <polygon points="430,434 452,446 430,458" fill="#4fbf7a" />
  <text x="315" y="430" fill="#9a9a9a" font-size="14" text-anchor="middle">
    2xx: read
  </text>
  <text x="315" y="480" fill="#9a9a9a" font-size="14" text-anchor="middle">
    3xx: refused, not followed
  </text>
  <g transform="translate(470,376)">
    <rect width="96" height="44" rx="10" fill="#1c2a21" stroke="#4fbf7a" />
    <text x="48" y="28" fill="#e8e8e8" font-size="15" text-anchor="middle">
      Nasdaq OI
    </text>
    <rect
      y="54"
      width="96"
      height="44"
      rx="10"
      fill="#1c2a21"
      stroke="#4fbf7a"
    />
    <text x="48" y="82" fill="#e8e8e8" font-size="15" text-anchor="middle">
      Swinglytics
    </text>
    <rect
      y="108"
      width="96"
      height="44"
      rx="10"
      fill="#1c2a21"
      stroke="#4fbf7a"
    />
    <text x="48" y="136" fill="#e8e8e8" font-size="15" text-anchor="middle">
      PostHog
    </text>
  </g>
  <g transform="translate(580,376)">
    <rect width="96" height="44" rx="10" fill="#1c2a21" stroke="#4fbf7a" />
    <text x="48" y="28" fill="#e8e8e8" font-size="15" text-anchor="middle">
      Resend
    </text>
    <rect
      y="54"
      width="96"
      height="44"
      rx="10"
      fill="#1c2a21"
      stroke="#4fbf7a"
    />
    <text x="48" y="82" fill="#e8e8e8" font-size="15" text-anchor="middle">
      ntfy
    </text>
  </g>
  <g transform="translate(720,376)">
    <rect
      width="200"
      height="150"
      rx="12"
      fill="#1d1f23"
      stroke="#5b5f66"
      stroke-width="2"
    />
    <text x="100" y="26" fill="#cfcfcf" font-size="15" text-anchor="middle">
      Options chain OI
    </text>
    <text x="30" y="58" fill="#cfcfcf" font-size="15">725C</text>
    <text x="170" y="58" fill="#4fbf7a" font-size="15" text-anchor="end">
      Nasdaq
    </text>
    <text x="30" y="86" fill="#cfcfcf" font-size="15">700P</text>
    <text x="170" y="86" fill="#4fbf7a" font-size="15" text-anchor="end">
      Nasdaq
    </text>
    <text x="30" y="114" fill="#cfcfcf" font-size="15">150C</text>
    <text x="170" y="114" fill="#4fbf7a" font-size="15" text-anchor="end">
      Nasdaq
    </text>
    <text x="100" y="140" fill="#9a9a9a" font-size="13" text-anchor="middle">
      expected after deploy
    </text>
  </g>
  <g transform="translate(960,386)">
    <rect
      width="200"
      height="130"
      rx="12"
      fill="#16261c"
      stroke="#4fbf7a"
      stroke-width="2"
    />
    <g transform="translate(80,18)">
      <path
        d="M20 2 L38 9 V22 C38 33 30 40 20 44 C10 40 2 33 2 22 V9 Z"
        fill="none"
        stroke="#4fbf7a"
        stroke-width="3"
      />
      <path
        d="M12 23 L18 29 L29 16"
        fill="none"
        stroke="#4fbf7a"
        stroke-width="3"
        stroke-linecap="round"
      />
    </g>
    <text x="100" y="86" fill="#e8e8e8" font-size="14" text-anchor="middle">
      CI guard fails on any
    </text>
    <text x="100" y="106" fill="#e8e8e8" font-size="14" text-anchor="middle">
      redirect "error" in source
    </text>
  </g>
</svg>
