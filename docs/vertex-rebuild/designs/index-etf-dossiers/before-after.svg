  <rect
    x="640"
    y="126"
    width="94"
    height="26"
    rx="13"
    fill="#022c22"
    stroke="#10b981"
  />
  <text
    x="687"
    y="143"
    fill="#6ee7b7"
    font-size="12"
    font-weight="700"
    text-anchor="middle"
