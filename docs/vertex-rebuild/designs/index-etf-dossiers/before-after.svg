    <line x1="20" y1="60" x2="476" y2="60" stroke="#1e293b" />
    <line x1="20" y1="95" x2="476" y2="95" stroke="#1e293b" />
    <line x1="20" y1="130" x2="476" y2="130" stroke="#1e293b" />
    <!-- SMA 200 line -->
    <path
      d="M 24 108 Q 160 96 260 90 T 468 96"
      fill="none"
      stroke="#64748b"
      stroke-width="2"
      stroke-dasharray="4,3"
    />
    <text x="414" y="88" fill="#94a3b8" font-size="10">SMA 200</text>
    <!-- Price up to Sep 10 -->
    <path
      d="M 24 102 L 85 88 L 145 78 L 210 66 L 260 58"
      fill="none"
      stroke="#34d399"
      stroke-width="2.5"
    />
    <!-- Cutoff line -->
    <line
      x1="260"
      y1="36"
      x2="260"
      y2="146"
      stroke="#ef4444"
      stroke-width="1.5"
      stroke-dasharray="4,3"
    />
    <text x="266" y="48" fill="#f87171" font-size="10" font-weight="600">
      Frozen: 2026-09-10
    </text>
    <!-- Actual price after Sep 10 (ignored) -->
    <path
      d="M 260 58 L 315 74 L 370 98 L 420 116 L 468 126"
      fill="none"
      stroke="#ef4444"
      stroke-width="2"
      stroke-dasharray="3,3"
    />
    <circle cx="468" cy="126" r="4" fill="#ef4444" />
    <text x="330" y="142" fill="#f87171" font-size="10">
      Live close -5.6% below SMA 200 (unseen)
    </text>
  </g>

  <!-- Problem summary bar (Before) -->
  <g transform="translate(64, 462)">
    <rect
      x="0"
      y="0"
      width="496"
      height="102"
      rx="10"
      fill="#1e1b24"
      stroke="#7f1d1d"
    />
    <circle cx="24" cy="28" r="7" fill="#ef4444" />
    <text x="40" y="33" fill="#fecaca" font-size="13" font-weight="600">
