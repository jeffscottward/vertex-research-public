<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 620"
  width="1200"
  height="620"
  font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
>
  <title>Index ETF Dossiers &amp; Freshness: Before vs After</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f17" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <marker
      id="arr-muted"
      viewBox="0 0 10 10"
      refX="8"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M0,1 L10,5 L0,9 z" fill="#64748b" />
    </marker>
    <marker
      id="arr-green"
      viewBox="0 0 10 10"
      refX="8"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M0,1 L10,5 L0,9 z" fill="#34d399" />
    </marker>
    <marker
      id="arr-amber"
      viewBox="0 0 10 10"
      refX="8"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M0,1 L10,5 L0,9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect width="1200" height="620" rx="16" fill="url(#bg)" />

  <!-- Header -->
  <text x="48" y="54" fill="#f8fafc" font-size="24" font-weight="700">
    Index ETF Dossiers &amp; Stage Freshness
  </text>
  <text x="48" y="80" fill="#94a3b8" font-size="14">
    Read-time refresh from market_bar_series (1d) · IWM &amp; DIA added · Stale
    stage labels flagged (&gt; 2 NYSE sessions)
  </text>
  <rect
    x="1030"
    y="34"
    width="122"
    height="30"
    rx="15"
    fill="#1e293b"
    stroke="#334155"
  />
  <text
    x="1091"
    y="54"
    fill="#f59e0b"
    font-size="12"
    font-weight="600"
    text-anchor="middle"
  >
    RESEARCH ONLY
  </text>

  <!-- LEFT: BEFORE -->
  <rect
    x="44"
    y="108"
    width="536"
    height="476"
    rx="14"
    fill="#0f172a"
    stroke="#7f1d1d"
    stroke-width="1.5"
  />
  <rect
    x="64"
    y="126"
    width="94"
    height="26"
    rx="13"
    fill="#450a0a"
    stroke="#ef4444"
  />
  <text
    x="111"
    y="143"
    fill="#fca5a5"
    font-size="12"
    font-weight="700"
    text-anchor="middle"
  >
    BEFORE
  </text>
  <text x="172" y="144" fill="#e2e8f0" font-size="15" font-weight="600">
    Frozen import · 2 of 4 ETFs · silent stale stage
  </text>

  <!-- 4 ETF tiles (Before) -->
  <g transform="translate(64, 170)">
    <!-- SPY -->
    <rect
      x="0"
      y="0"
      width="118"
      height="86"
      rx="10"
      fill="#1e293b"
      stroke="#b45309"
    />
    <text x="14" y="26" fill="#f8fafc" font-size="16" font-weight="700">
      SPY
    </text>
    <text x="14" y="46" fill="#fbbf24" font-size="11">2026-09-10</text>
    <rect x="14" y="56" width="90" height="20" rx="4" fill="#451a03" />
    <text x="59" y="70" fill="#fcd34d" font-size="10" text-anchor="middle">
      Stage 2 (old)
    </text>

    <!-- QQQ -->
    <rect
      x="128"
      y="0"
      width="118"
      height="86"
      rx="10"
      fill="#1e293b"
      stroke="#b45309"
    />
    <text x="142" y="26" fill="#f8fafc" font-size="16" font-weight="700">
      QQQ
    </text>
    <text x="142" y="46" fill="#fbbf24" font-size="11">2026-09-10</text>
    <rect x="142" y="56" width="90" height="20" rx="4" fill="#451a03" />
    <text x="187" y="70" fill="#fcd34d" font-size="10" text-anchor="middle">
      Stage 2 (old)
    </text>

    <!-- IWM missing -->
    <rect
      x="256"
      y="0"
      width="118"
      height="86"
      rx="10"
      fill="#111827"
      stroke="#ef4444"
      stroke-dasharray="5,4"
    />
    <text x="270" y="26" fill="#94a3b8" font-size="16" font-weight="700">
      IWM
    </text>
    <text x="270" y="48" fill="#f87171" font-size="11" font-weight="600">
      404 Missing
    </text>
    <text x="270" y="68" fill="#64748b" font-size="10">No dossier row</text>

    <!-- DIA missing -->
    <rect
      x="384"
      y="0"
      width="118"
      height="86"
      rx="10"
      fill="#111827"
      stroke="#ef4444"
      stroke-dasharray="5,4"
    />
    <text x="398" y="26" fill="#94a3b8" font-size="16" font-weight="700">
      DIA
    </text>
    <text x="398" y="48" fill="#f87171" font-size="11" font-weight="600">
      404 Missing
    </text>
    <text x="398" y="68" fill="#64748b" font-size="10">No dossier row</text>
  </g>

  <!-- Mini chart showing QQQ drift (Before) -->
  <g transform="translate(64, 278)">
    <rect
      x="0"
      y="0"
      width="496"
      height="164"
      rx="10"
      fill="#111827"
      stroke="#334155"
    />
    <text x="16" y="24" fill="#94a3b8" font-size="12" font-weight="600">
