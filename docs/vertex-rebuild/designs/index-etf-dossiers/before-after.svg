    </text>
    <circle cx="24" cy="56" r="7" fill="#ef4444" />
    <text x="40" y="61" fill="#fecaca" font-size="13">
      market_bar_series (1d) refreshed nightly, but ignored by dossiers
    </text>
    <circle cx="24" cy="84" r="7" fill="#ef4444" />
    <text x="40" y="89" fill="#fecaca" font-size="13">
      No freshness check — Stage 2 shown with zero stale indicator
    </text>
  </g>

  <!-- Center Arrow -->
  <line
    x1="584"
    y1="346"
    x2="616"
    y2="346"
    stroke="#f59e0b"
    stroke-width="3"
    marker-end="url(#arr-amber)"
