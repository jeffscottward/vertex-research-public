      SPY
    </text>
    <text x="14" y="46" fill="#34d399" font-size="11">market_bars</text>
    <rect x="14" y="56" width="90" height="20" rx="4" fill="#064e3b" />
    <text x="59" y="70" fill="#a7f3d0" font-size="10" text-anchor="middle">
      Fresh · prev day
    </text>

    <!-- QQQ -->
    <rect
      x="128"
      y="0"
      width="118"
      height="86"
      rx="10"
      fill="#1e293b"
      stroke="#10b981"
    />
    <text x="142" y="26" fill="#f8fafc" font-size="16" font-weight="700">
      QQQ
    </text>
    <text x="142" y="46" fill="#34d399" font-size="11">market_bars</text>
    <rect x="142" y="56" width="90" height="20" rx="4" fill="#064e3b" />
    <text x="187" y="70" fill="#a7f3d0" font-size="10" text-anchor="middle">
      Fresh · prev day
    </text>

    <!-- IWM -->
    <rect
      x="256"
      y="0"
      width="118"
      height="86"
      rx="10"
      fill="#1e293b"
      stroke="#10b981"
    />
    <text x="270" y="26" fill="#f8fafc" font-size="16" font-weight="700">
      IWM
    </text>
    <text x="270" y="46" fill="#34d399" font-size="11">Added · 1d bars</text>
    <rect x="270" y="56" width="90" height="20" rx="4" fill="#064e3b" />
    <text x="315" y="70" fill="#a7f3d0" font-size="10" text-anchor="middle">
      Fresh · prev day
    </text>

    <!-- DIA -->
    <rect
      x="384"
      y="0"
      width="118"
      height="86"
      rx="10"
      fill="#1e293b"
      stroke="#10b981"
    />
    <text x="398" y="26" fill="#f8fafc" font-size="16" font-weight="700">
      DIA
    </text>
    <text x="398" y="46" fill="#34d399" font-size="11">Added · 1d bars</text>
    <rect x="398" y="56" width="90" height="20" rx="4" fill="#064e3b" />
    <text x="443" y="70" fill="#a7f3d0" font-size="10" text-anchor="middle">
      Fresh · prev day
    </text>
  </g>

  <!-- UI + API freshness badges mock (After) -->
  <g transform="translate(640, 278)">
    <rect
      x="0"
      y="0"
      width="496"
      height="164"
      rx="10"
      fill="#111827"
      stroke="#334155"
    />
    <text x="16" y="24" fill="#94a3b8" font-size="12" font-weight="600">
      TWO HONEST STATES ON API &amp; DOSSIER PAGE (MOCK)
    </text>

    <!-- Fresh state row -->
    <rect
      x="16"
      y="38"
      width="464"
      height="50"
      rx="8"
      fill="#052e16"
      stroke="#10b981"
    />
    <text x="30" y="58" fill="#f8fafc" font-size="13" font-weight="700">
      QQQ / IWM / SPY / DIA (≤ 2 NYSE sessions behind)
    </text>
    <text x="30" y="76" fill="#a7f3d0" font-size="11">
      Data as of 2026-11-23 · Stored daily bars · Current SMA/RSI/ATR/Stage
    </text>
    <rect x="392" y="50" width="74" height="24" rx="12" fill="#10b981" />
    <text
      x="429"
      y="66"
      fill="#022c22"
      font-size="11"
      font-weight="700"
      text-anchor="middle"
    >
      FRESH
    </text>

    <!-- Stale state row -->
    <rect
      x="16"
      y="100"
      width="464"
      height="50"
      rx="8"
      fill="#451a03"
      stroke="#f59e0b"
    />
    <text x="30" y="120" fill="#fef3c7" font-size="13" font-weight="700">
      Archived dossier (&gt; 2 NYSE sessions behind)
    </text>
    <text x="30" y="138" fill="#fcd34d" font-size="11">
      Stage 2: advancing (stale; data as of 2026-09-10) · 50 sessions behind
    </text>
    <rect x="392" y="112" width="74" height="24" rx="12" fill="#f59e0b" />
    <text
      x="429"
      y="128"
      fill="#451a03"
      font-size="11"
      font-weight="700"
      text-anchor="middle"
    >
      STALE
    </text>
  </g>

  <!-- Solution summary bar (After) -->
  <g transform="translate(640, 462)">
    <rect
      x="0"
      y="0"
      width="496"
      height="102"
      rx="10"
      fill="#0a221c"
      stroke="#065f46"
    />
    <circle cx="24" cy="28" r="7" fill="#34d399" />
    <text x="40" y="33" fill="#d1fae5" font-size="13" font-weight="600">
      Zero second price store — single source: market_bar_series (1d)
    </text>
    <circle cx="24" cy="56" r="7" fill="#34d399" />
    <text x="40" y="61" fill="#d1fae5" font-size="13">
