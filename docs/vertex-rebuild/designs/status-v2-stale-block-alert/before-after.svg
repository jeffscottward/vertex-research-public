      600 13px system-ui,
      -apple-system,
      sans-serif;
    fill: #e6edf3;
  }
  .t-small {
    font:
      500 11px system-ui,
      -apple-system,
      sans-serif;
    fill: #8b949e;
  }
  .t-mono {
    font:
      600 11px ui-monospace,
