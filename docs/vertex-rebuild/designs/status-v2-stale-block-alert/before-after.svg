<svg
  aria-labelledby="title desc"
  height="600"
  role="img"
  viewBox="0 0 1120 600"
  width="1120"
  xmlns="http://www.w3.org/2000/svg"
>
  <title id="title">status-v2 Stale-Block Alerting: Before vs After</title>
  <desc id="desc">
    Visual flow comparing QuantVPS vertex-status-v2-alert.service before (checks
    HTTP 200, schema, and auth guards only while stale or unavailable broker
    blocks go silent) versus after (adds a third independent stale-block state
    machine checking generatedAt and orders, fills, positions, and equity with a
    3-tick threshold, deduplicated alert, and recovery notice to #omp-alerts).
  </desc>
  <defs>
    <marker
      id="arr-muted"
      markerHeight="7"
      markerWidth="7"
      orient="auto-start-reverse"
      refX="7"
      refY="5"
      viewBox="0 0 10 10"
    >
      <path d="M0 1 L8 5 L0 9 Z" fill="#8b949e" />
    </marker>
    <marker
      id="arr-red"
      markerHeight="7"
      markerWidth="7"
      orient="auto-start-reverse"
      refX="7"
      refY="5"
      viewBox="0 0 10 10"
    >
      <path d="M0 1 L8 5 L0 9 Z" fill="#f85149" />
    </marker>
    <marker
      id="arr-green"
      markerHeight="7"
      markerWidth="7"
      orient="auto-start-reverse"
      refX="7"
      refY="5"
      viewBox="0 0 10 10"
    >
      <path d="M0 1 L8 5 L0 9 Z" fill="#3fb950" />
    </marker>
    <marker
      id="arr-gold"
      markerHeight="7"
      markerWidth="7"
      orient="auto-start-reverse"
      refX="7"
      refY="5"
      viewBox="0 0 10 10"
    >
      <path d="M0 1 L8 5 L0 9 Z" fill="#d29922" />
    </marker>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#11161f" />
    </linearGradient>
    <linearGradient id="gold-glow" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#d29922" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#d29922" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <style>
  .t-title {
    font:
      700 22px system-ui,
