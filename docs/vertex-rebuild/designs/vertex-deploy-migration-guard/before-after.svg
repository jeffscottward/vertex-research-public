<svg
  aria-label="Before vs After: QuantVPS web deploy migration guard"
  height="520"
  role="img"
  viewBox="0 0 1120 520"
  width="1120"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#131922" />
    </linearGradient>
    <marker
      id="arr-red"
      markerHeight="7"
      markerWidth="7"
      orient="auto"
      refX="8"
      refY="5"
      viewBox="0 0 10 10"
    >
      <path d="M0,1 L9,5 L0,9 z" fill="#f87171" />
    </marker>
    <marker
      id="arr-gold"
      markerHeight="7"
      markerWidth="7"
      orient="auto"
      refX="8"
      refY="5"
      viewBox="0 0 10 10"
    >
      <path d="M0,1 L9,5 L0,9 z" fill="#d4af37" />
    </marker>
    <marker
      id="arr-green"
      markerHeight="7"
      markerWidth="7"
      orient="auto"
      refX="8"
      refY="5"
      viewBox="0 0 10 10"
    >
      <path d="M0,1 L9,5 L0,9 z" fill="#34d399" />
    </marker>
    <marker
      id="arr-slate"
      markerHeight="7"
      markerWidth="7"
      orient="auto"
      refX="8"
      refY="5"
      viewBox="0 0 10 10"
    >
      <path d="M0,1 L9,5 L0,9 z" fill="#94a3b8" />
    </marker>
  </defs>

  <rect fill="url(#bg)" height="520" rx="16" width="1120" />

  <!-- Header -->
  <text
    fill="#f8fafc"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="22"
    font-weight="700"
    x="36"
    y="46"
  >
    QuantVPS Web Deploy · Migration Guard
  </text>
  <text
    fill="#94a3b8"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="13"
    x="36"
    y="70"
  >
    restart-when-idle.sh blocks restart (exit 15) when prod Postgres is missing
    build migrations
  </text>

  <!-- BEFORE lane -->
  <rect
    fill="#171216"
    height="148"
    rx="12"
    stroke="#7f1d1d"
    stroke-width="1.5"
    width="1056"
    x="32"
    y="96"
  />
  <rect fill="#7f1d1d" height="24" rx="12" width="84" x="48" y="110" />
  <text
    fill="#fecaca"
    font-family="system-ui, sans-serif"
    font-size="12"
    font-weight="700"
    text-anchor="middle"
    x="90"
    y="126"
  >
    BEFORE
  </text>

  <!-- Node B1: Build Commit -->
  <g transform="translate(80,152)">
    <rect
      fill="#1e2430"
      height="68"
      rx="10"
      stroke="#475569"
      width="144"
      x="0"
      y="0"
    />
    <!-- Package cube icon -->
    <polygon
      fill="none"
      points="28,22 40,16 52,22 40,28"
      stroke="#cbd5e1"
      stroke-width="1.8"
    />
    <polyline
      fill="none"
      points="28,22 28,36 40,42 52,36 52,22"
      stroke="#cbd5e1"
      stroke-width="1.8"
    />
    <line stroke="#cbd5e1" stroke-width="1.8" x1="40" x2="40" y1="28" y2="42" />
    <text
      fill="#e2e8f0"
      font-family="system-ui, sans-serif"
      font-size="13"
      font-weight="600"
      x="64"
      y="30"
    >
      Build SHA
    </text>
    <text fill="#94a3b8" font-family="monospace" font-size="11" x="64" y="48">
      0076..0094
    </text>
  </g>

  <line
    marker-end="url(#arr-slate)"
    stroke="#94a3b8"
    stroke-width="2"
    x1="224"
    x2="294"
    y1="186"
    y2="186"
  />

  <!-- Node B2: No DB check -->
  <g transform="translate(302,152)">
    <rect
      fill="#1e2430"
      height="68"
      rx="10"
      stroke="#475569"
      stroke-dasharray="5,4"
      width="196"
      x="0"
      y="0"
    />
    <!-- Skipped eye/database icon -->
    <ellipse
      cx="32"
      cy="24"
      fill="none"
      rx="12"
      ry="5"
      stroke="#94a3b8"
      stroke-width="1.6"
    />
    <path
      d="M20,24 v18 c0,3 5,5 12,5 s12,-2 12,-5 v-18"
      fill="none"
      stroke="#94a3b8"
      stroke-width="1.6"
    />
    <line stroke="#f87171" stroke-width="2.2" x1="18" x2="46" y1="44" y2="18" />
    <text
      fill="#cbd5e1"
      font-family="system-ui, sans-serif"
      font-size="13"
      font-weight="600"
      x="58"
      y="30"
    >
      No DB Check
    </text>
    <text
      fill="#94a3b8"
      font-family="system-ui, sans-serif"
      font-size="11"
      x="58"
      y="48"
    >
      restarts immediately
    </text>
  </g>

  <line
    marker-end="url(#arr-red)"
    stroke="#f87171"
    stroke-width="2"
    x1="498"
    x2="568"
    y1="186"
    y2="186"
  />

  <!-- Node B3: vertex-web restarted -->
  <g transform="translate(576,152)">
    <rect
      fill="#23191d"
      height="68"
      rx="10"
      stroke="#b91c1c"
      width="194"
      x="0"
      y="0"
    />
    <!-- Restart loop icon -->
    <path
      d="M40,22 a12,12 0 1,0 6,16"
      fill="none"
      stroke="#fca5a5"
      stroke-width="2"
    />
    <polygon fill="#fca5a5" points="39,17 47,21 40,26" />
    <text
      fill="#fecaca"
      font-family="system-ui, sans-serif"
      font-size="13"
      font-weight="600"
      x="62"
      y="30"
    >
      vertex-web Live
    </text>
    <text
      fill="#fca5a5"
      font-family="system-ui, sans-serif"
      font-size="11"
      x="62"
      y="48"
    >
      / health 200 · passes
    </text>
  </g>

  <line
    marker-end="url(#arr-red)"
    stroke="#f87171"
    stroke-width="2"
    x1="770"
    x2="840"
    y1="186"
    y2="186"
  />

  <!-- Node B4: 503 outage -->
  <g transform="translate(848,152)">
    <rect
      fill="#2d1418"
      height="68"
      rx="10"
      stroke="#ef4444"
      stroke-width="1.8"
      width="212"
      x="0"
      y="0"
    />
    <!-- Alert triangle -->
    <polygon
      fill="none"
      points="34,18 48,44 20,44"
      stroke="#f87171"
      stroke-width="2"
    />
    <line stroke="#f87171" stroke-width="2" x1="34" x2="34" y1="27" y2="35" />
    <circle cx="34" cy="40" fill="#f87171" r="1.4" />
    <text
      fill="#fecaca"
      font-family="system-ui, sans-serif"
      font-size="14"
      font-weight="700"
      x="60"
      y="30"
    >
      HTTP 503
    </text>
    <text fill="#fca5a5" font-family="monospace" font-size="11" x="60" y="48">
      missing table / grant
    </text>
  </g>

  <!-- AFTER lane -->
  <rect
    fill="#101820"
    height="224"
    rx="12"
    stroke="#d4af37"
    stroke-width="1.5"
    width="1056"
    x="32"
    y="264"
  />
  <rect fill="#d4af37" height="24" rx="12" width="76" x="48" y="278" />
  <text
    fill="#0d1117"
    font-family="system-ui, sans-serif"
    font-size="12"
    font-weight="700"
    text-anchor="middle"
    x="86"
    y="294"
