    AFTER
  </text>

  <!-- Node A1: Build Commit -->
  <g transform="translate(80,354)">
    <rect
      fill="#1e2430"
      height="68"
      rx="10"
      stroke="#475569"
      width="144"
      x="0"
      y="0"
    />
    <polygon
      fill="none"
      points="28,22 40,16 52,22 40,28"
      stroke="#e2e8f0"
      stroke-width="1.8"
    />
    <polyline
      fill="none"
      points="28,22 28,36 40,42 52,36 52,22"
      stroke="#e2e8f0"
      stroke-width="1.8"
    />
    <line stroke="#e2e8f0" stroke-width="1.8" x1="40" x2="40" y1="28" y2="42" />
    <text
      fill="#e2e8f0"
      font-family="system-ui, sans-serif"
      font-size="13"
      font-weight="600"
      x="64"
      y="30"
    >
      Build SHA
    </text>
    <text fill="#94a3b8" font-family="monospace" font-size="11" x="64" y="48">
      _journal.json
    </text>
  </g>

  <line
    marker-end="url(#arr-gold)"
    stroke="#d4af37"
    stroke-width="2"
    x1="224"
    x2="290"
    y1="388"
    y2="388"
  />

  <!-- Node A2: Migration Guard -->
  <g transform="translate(298,334)">
    <rect
      fill="#1c222e"
      height="108"
      rx="12"
      stroke="#d4af37"
      stroke-width="2"
      width="248"
      x="0"
      y="0"
    />
    <!-- Shield icon -->
    <path
      d="M36,24 L52,30 v14 c0,12 -7,20 -16,24 c-9,-4 -16,-12 -16,-24 v-14 z"
      fill="#2b2617"
      stroke="#d4af37"
      stroke-width="2"
    />
    <polyline
      fill="none"
      points="29,46 34,51 44,39"
      stroke="#d4af37"
      stroke-width="2.2"
    />
    <text
      fill="#fef08a"
      font-family="system-ui, sans-serif"
      font-size="14"
      font-weight="700"
      x="66"
      y="38"
    >
      Migration Guard
    </text>
    <text fill="#cbd5e1" font-family="monospace" font-size="11" x="66" y="57">
      vertex-postgres (RO)
    </text>
    <text
      fill="#94a3b8"
      font-family="system-ui, sans-serif"
      font-size="11"
      x="66"
      y="75"
    >
      tables · cols · indexes
    </text>
    <text
      fill="#94a3b8"
      font-family="system-ui, sans-serif"
      font-size="11"
      x="66"
      y="91"
    >
      checks · grants · ledger
    </text>
  </g>

  <!-- Branch 1: Missing -> Exit 15 -->
  <path
    d="M546,362 C610,362 610,334 674,334"
    fill="none"
    marker-end="url(#arr-red)"
    stroke="#f87171"
    stroke-width="2.2"
  />
  <text
    fill="#fca5a5"
    font-family="system-ui, sans-serif"
    font-size="11"
    font-weight="600"
    text-anchor="middle"
    x="608"
    y="324"
  >
    unapplied / unreadable
  </text>

  <g transform="translate(682,298)">
    <rect
      fill="#2a1519"
      height="72"
      rx="10"
      stroke="#f87171"
      stroke-width="1.8"
      width="378"
      x="0"
      y="0"
    />
    <!-- Stop octagon -->
    <polygon
      fill="none"
      points="28,20 42,20 50,28 50,42 42,50 28,50 20,42 20,28"
      stroke="#f87171"
      stroke-width="2"
    />
    <line stroke="#f87171" stroke-width="2.2" x1="28" x2="42" y1="28" y2="42" />
    <line stroke="#f87171" stroke-width="2.2" x1="42" x2="28" y1="28" y2="42" />
    <text
      fill="#fecaca"
      font-family="system-ui, sans-serif"
      font-size="14"
      font-weight="700"
      x="64"
      y="29"
    >
      Refuse Restart · Exit 15
    </text>
    <text fill="#fca5a5" font-family="monospace" font-size="11" x="64" y="47">
      - 0076_research_screen: missing table ...
    </text>
    <text
      fill="#94a3b8"
      font-family="system-ui, sans-serif"
      font-size="10"
      x="64"
      y="62"
    >
      old process stays up · worker untouched
    </text>
  </g>

  <!-- Branch 2: Applied -> Restart -->
  <path
    d="M546,414 C610,414 610,434 674,434"
    fill="none"
    marker-end="url(#arr-green)"
    stroke="#34d399"
    stroke-width="2.2"
  />
  <text
    fill="#6ee7b7"
    font-family="system-ui, sans-serif"
    font-size="11"
    font-weight="600"
    text-anchor="middle"
    x="608"
    y="454"
  >
    all applied
  </text>

  <g transform="translate(682,398)">
    <rect
      fill="#0f251e"
      height="72"
      rx="10"
      stroke="#34d399"
      stroke-width="1.8"
      width="378"
      x="0"
      y="0"
    />
    <!-- Check circle -->
    <circle
      cx="35"
      cy="36"
      fill="none"
      r="15"
      stroke="#34d399"
      stroke-width="2"
    />
    <polyline
      fill="none"
      points="27,36 33,42 44,30"
      stroke="#34d399"
      stroke-width="2.4"
    />
    <text
      fill="#d1fae5"
      font-family="system-ui, sans-serif"
      font-size="14"
      font-weight="700"
      x="64"
      y="29"
    >
      Idle Wait → Swap → Restart · Exit 0
    </text>
    <text fill="#6ee7b7" font-family="monospace" font-size="11" x="64" y="47">
      all 95 build migrations applied
    </text>
    <text
      fill="#94a3b8"
      font-family="system-ui, sans-serif"
      font-size="10"
      x="64"
      y="62"
    >
      health verified · exec-node untouched
    </text>
  </g>
</svg>
