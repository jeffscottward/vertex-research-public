<text x="40" y="56" font-size="28" font-weight="700" fill="#fff">Where the prune sits in a web deploy</text>
<text x="40" y="86" font-size="16" fill="#9aa3b2">The prune is a separate script and the last step. The restart script still deletes nothing.</text>
