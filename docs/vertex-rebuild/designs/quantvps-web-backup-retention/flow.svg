l(#a)"/><rect x="855" y="150" width="135" height="70" rx="10" fill="#1b2230" stroke="#30363d" stroke-width="2"/><text x="922.5" y="185.0" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">6-7 checks</text><text x="922.5" y="207.0" text-anchor="middle" font-size="13" fill="#9aa3b2">proxy, CSP</text><line x1="992" y1="185" x2="1014" y2="185" stroke="#d4a843" stroke-width="3" marker-end="url(#a)"/><rect x="1018" y="150" width="135" height="70" rx="10" fill="#2a2410" stroke="#d4a843" stroke-width="2"/><text x="1085.5" y="185.0" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">8 prune</text><text x="1085.5" y="207.0" text-anchor="middle" font-size="13" fill="#9aa3b2">new step</text>
