<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 980 360"
  role="img"
  aria-label="Who starts what in a recording"
>
  <rect width="980" height="360" fill="#0f1115" />
  <defs>
    <marker
      id="a"
      viewBox="0 0 10 10"
      refX="8"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto"
    >
      <path d="M0 0 L10 5 L0 10 z" fill="#8b8f98" />
    </marker>
    <marker
      id="b"
      viewBox="0 0 10 10"
      refX="8"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto"
    >
      <path d="M0 0 L10 5 L0 10 z" fill="#d4a72c" />
    </marker>
  </defs>
  <g font-family="Manrope, Public Sans, Helvetica, Arial, sans-serif">
    <text x="40" y="44" font-size="22" font-weight="700" fill="#e8e6df">
      One command starts a recording
    </text>
    <rect
      x="40"
      y="90"
      width="190"
      height="70"
      rx="12"
      fill="#161a22"
      stroke="#2a2f3a"
      stroke-width="2"
    />
    <text
      x="135.0"
      y="120"
      font-size="15"
      font-weight="700"
      fill="#e8e6df"
      text-anchor="middle"
    >
      record-session.ts
    </text>
    <text x="135.0" y="142" font-size="12" fill="#8b8f98" text-anchor="middle">
      bun run eval:semantic:record
    </text>
    <rect
      x="290"
      y="90"
      width="190"
      height="70"
      rx="12"
      fill="#161a22"
      stroke="#d4a72c"
      stroke-width="2"
    />
    <text
      x="385.0"
      y="120"
      font-size="15"
      font-weight="700"
      fill="#e8e6df"
      text-anchor="middle"
    >
      OMP session
    </text>
    <text x="385.0" y="142" font-size="12" fill="#8b8f98" text-anchor="middle">
      model: Claude Opus 5.5
    </text>
    <rect
      x="540"
      y="90"
      width="170"
      height="70"
      rx="12"
      fill="#161a22"
      stroke="#d4a72c"
      stroke-width="2"
    />
    <text
      x="625.0"
      y="120"
      font-size="15"
      font-weight="700"
      fill="#e8e6df"
      text-anchor="middle"
    >
      bridge.ts
    </text>
    <text x="625.0" y="142" font-size="12" fill="#8b8f98" text-anchor="middle">
      completion()
    </text>
    <rect
      x="770"
      y="90"
      width="170"
      height="70"
      rx="12"
      fill="#161a22"
      stroke="#3fb950"
      stroke-width="2"
    />
    <text
      x="855.0"
      y="120"
      font-size="15"
      font-weight="700"
      fill="#e8e6df"
      text-anchor="middle"
    >
      record.ts
    </text>
    <text x="855.0" y="142" font-size="12" fill="#8b8f98" text-anchor="middle">
      trials, Postgres
    </text>
    <path
      d="M230 125 H282"
      stroke="#8b8f98"
      stroke-width="2"
      marker-end="url(#a)"
    />
    <path
      d="M480 125 H532"
      stroke="#8b8f98"
      stroke-width="2"
      marker-end="url(#a)"
    />
    <path
      d="M710 112 H762"
      stroke="#8b8f98"
      stroke-width="2"
      marker-end="url(#a)"
    />
    <text x="736" y="104" font-size="11" fill="#8b8f98" text-anchor="middle">
      starts
    </text>
    <path
      d="M855 160 V220 H625 V168"
      stroke="#d4a72c"
      stroke-width="2.5"
      fill="none"
      marker-end="url(#b)"
    />
    <text x="740" y="240" font-size="13" fill="#d4a72c" text-anchor="middle">
      stdout: one request for each model call
    </text>
    <path
      d="M600 160 V270 H880 V168"
      stroke="#3fb950"
      stroke-width="2.5"
      fill="none"
      marker-end="url(#a)"
    />
    <text x="740" y="290" font-size="13" fill="#3fb950" text-anchor="middle">
      stdin: reply + model id, or a fault
    </text>
    <g transform="translate(40,210)">
      <rect
        x="0"
        y="0"
        width="64"
        height="76"
        rx="6"
        fill="#1a1e27"
        stroke="#3fb950"
        stroke-width="2"
      />
      <path
        d="M12 20 H52 M12 34 H52 M12 48 H40"
        stroke="#3fb950"
        stroke-width="3"
        stroke-linecap="round"
      />
      <text x="80" y="30" font-size="14" fill="#e8e6df">recording file</text>
      <text x="80" y="50" font-size="12" fill="#8b8f98">
        written after each trial
      </text>
    </g>
    <path
      d="M855 90 V72 H22 V248 H33"
      stroke="#8b8f98"
      stroke-width="2"
      fill="none"
      stroke-dasharray="6 5"
      marker-end="url(#a)"
    />
    <text x="463" y="66" font-size="11" fill="#8b8f98" text-anchor="middle">
      writes
    </text>
    <text x="40" y="330" font-size="12" fill="#8b8f98">
      Before the start the bridge checks the model with one call. A reply from
      another model stops the run.
    </text>
  </g>
</svg>
