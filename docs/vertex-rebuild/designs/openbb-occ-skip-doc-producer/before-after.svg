<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="680"
  viewBox="0 0 1200 680"
  font-family="DejaVu Sans, system-ui, sans-serif"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">OpenBB cboe-option-iv OCC skip flow: before vs after</title>
  <desc id="desc">
    Before: cboe.py wrote Cboe non-standard OCC skips to warnings, tick.ts
    matched them with an interim regex, and openbb.md still documented any
    warning as partial. After: cboe.py emits skips on the producer-side info
    channel of openbb-batch.v1, tick.ts removes the regex and computes status
    from warnings only while preserving info in openbb_ingest_runs.warnings, and
    openbb.md matches the code.
  </desc>
