    <marker
      id="arrow-muted"
      viewBox="0 0 10 10"
      refX="8"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M0,1 L10,5 L0,9 z" fill="#94a3b8" />
    </marker>
  </defs>

