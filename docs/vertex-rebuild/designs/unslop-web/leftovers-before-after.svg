<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 720"
  width="1200"
  height="720"
  role="img"
  aria-label="Before and after visual comparison of Vertex web leftover template pattern fixes (MOCK)"
>
  <defs>
    <style>
    .bg {
      fill: #0b0e14;
    }
    .panel {
      fill: #121722;
      stroke: #242d3d;
      stroke-width: 1.5;
      rx: 12;
    }
    .panel-after {
      fill: #121722;
      stroke: #314258;
      stroke-width: 1.5;
      rx: 12;
    }
    .subbox {
      fill: #181f2e;
      stroke: #2b3548;
      stroke-width: 1;
      rx: 6;
    }
    .title {
      fill: #f2f4f8;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 20px;
      font-weight: 700;
    }
    .subtitle {
      fill: #8f9bb3;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
    }
    .sec {
      fill: #d7b25c;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
    }
    .col-before {
      fill: #e06c75;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }
    .col-after {
      fill: #58c47c;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }
    .txt {
      fill: #e5e9f2;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 12.5px;
    }
    .muted {
      fill: #8f9bb3;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 11.5px;
    }
    .mono-bad {
      fill: #f2a4aa;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 11.5px;
    }
    .mono-ok {
      fill: #9ad8ae;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 11.5px;
    }
    .mono-keep {
      fill: #c8d3e6;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 11px;
    }
    .warn {
      fill: #eab308;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 11.5px;
      font-weight: 600;
    }
    .pill-green {
      fill: #132c20;
      stroke: #2c6e49;
      stroke-width: 1;
      rx: 11;
    }
    .pill-amber {
      fill: #33260c;
      stroke: #9a7016;
      stroke-width: 1;
      rx: 11;
    }
    .pill-gray {
      fill: #1c2333;
      stroke: #364157;
      stroke-width: 1;
      rx: 11;
    }
    .arrow {
      stroke: #d7b25c;
      stroke-width: 2;
      fill: none;
      marker-end: url(#ah);
    }
    .mock-bg {
      fill: #2b2210;
      stroke: #d7b25c;
      stroke-width: 1;
      rx: 6;
    }
    .mock-txt {
      fill: #f5d27a;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }
    </style>
    <marker
      id="ah"
      markerWidth="8"
      markerHeight="6"
      refX="7"
      refY="3"
      orient="auto"
    >
      <polygon points="0 0, 8 3, 0 6" fill="#d7b25c" />
    </marker>
  </defs>

  <!-- Canvas -->
  <rect class="bg" x="0" y="0" width="1200" height="720" />

  <!-- Header -->
  <text class="title" x="32" y="42">
    Vertex Web: Leftover Template Patterns — Before vs After
  </text>
  <text class="subtitle" x="32" y="64">
    Market context · Portfolio · Pick lists · Papers · Charts (Risk allocator
    file paths kept as names)
  </text>
  <rect class="mock-bg" x="1096" y="22" width="72" height="24" />
  <text class="mock-txt" x="1132" y="38" text-anchor="middle">MOCK</text>

  <!-- Column Headers -->
  <text class="col-before" x="32" y="96">BEFORE</text>
  <text class="col-after" x="632" y="96">AFTER</text>

  <!-- ================= ROW 1: MARKET CONTEXT ================= -->
  <rect class="panel" x="32" y="106" width="536" height="148" />
  <text class="sec" x="50" y="128">
    1. MARKET CONTEXT — PILLS &amp; RAW SOURCE IDS
  </text>
  <!-- Mock table row before -->
  <rect class="subbox" x="50" y="140" width="500" height="98" />
  <text class="txt" x="64" y="162" font-weight="700">QQQ</text>
  <rect class="pill-green" x="112" y="147" width="76" height="22" />
  <circle cx="124" cy="158" r="3" fill="#58c47c" />
  <text class="txt" x="132" y="162" font-size="11">Risk on</text>
  <rect class="pill-green" x="206" y="147" width="80" height="22" />
  <circle cx="218" cy="158" r="3" fill="#58c47c" />
  <text class="txt" x="226" y="162" font-size="11">Uptrend</text>
  <rect class="pill-amber" x="294" y="147" width="60" height="22" />
  <circle cx="306" cy="158" r="3" fill="#eab308" />
  <text class="warn" x="314" y="162" font-size="11">Stale</text>
  <rect class="pill-gray" x="372" y="147" width="160" height="22" />
  <circle cx="384" cy="158" r="3" fill="#8f9bb3" />
  <text class="muted" x="392" y="162" font-size="11">yield_curve: steep</text>
  <text class="mono-bad" x="112" y="196">ETF · market_daily_series</text>
  <text class="mono-bad" x="318" y="196">
    Market-wide · openbb_macro:HY_OAS
  </text>
  <text class="mono-bad" x="112" y="218">ETF · market_context_gex</text>
  <text class="mono-bad" x="318" y="218">openbb_vol_context</text>

  <line class="arrow" x1="576" y1="180" x2="622" y2="180" />

  <rect class="panel-after" x="632" y="106" width="536" height="148" />
  <text class="sec" x="650" y="128">
    1. MARKET CONTEXT — PLAIN STATUS &amp; WORDS
  </text>
  <rect class="subbox" x="650" y="140" width="500" height="98" />
  <text class="txt" x="664" y="162" font-weight="700">QQQ</text>
  <text class="muted" x="712" y="162" font-weight="600">Risk on</text>
  <text class="muted" x="806" y="162" font-weight="600">Uptrend</text>
  <text class="warn" x="880" y="162">Stale</text>
  <text class="muted" x="954" y="162" font-weight="600">
    yield curve: steep
  </text>
  <text class="mono-ok" x="712" y="196">ETF · Daily price series</text>
  <text class="mono-ok" x="918" y="196">
    Market-wide · OpenBB macro (HY OAS)
  </text>
  <text class="mono-ok" x="712" y="218">ETF · Market-context GEX</text>
  <text class="mono-ok" x="918" y="218">OpenBB volatility</text>

  <!-- ================= ROW 2: PORTFOLIO ================= -->
  <rect class="panel" x="32" y="270" width="536" height="148" />
  <text class="sec" x="50" y="292">
    2. PORTFOLIO — 12 BORDERED TILES INSIDE BORDERED SUMMARY
  </text>
  <rect
    class="subbox"
    x="50"
    y="304"
    width="500"
    height="100"
    stroke="#475569"
    stroke-width="1.5"
  />
  <text class="txt" x="62" y="321" font-size="11" font-weight="600">
    Summary
  </text>
  <line x1="50" y1="328" x2="550" y2="328" stroke="#2b3548" />
  <!-- 6x2 bordered mini tiles -->
  <g fill="#101520" stroke="#e06c75" stroke-opacity="0.7" stroke-width="1">
    <rect x="60" y="336" width="74" height="26" rx="4" />
    <rect x="140" y="336" width="74" height="26" rx="4" />
    <rect x="220" y="336" width="74" height="26" rx="4" />
    <rect x="300" y="336" width="74" height="26" rx="4" />
    <rect x="380" y="336" width="74" height="26" rx="4" />
    <rect x="460" y="336" width="74" height="26" rx="4" />
    <rect x="60" y="368" width="74" height="26" rx="4" />
    <rect x="140" y="368" width="74" height="26" rx="4" />
    <rect x="220" y="368" width="74" height="26" rx="4" />
    <rect x="300" y="368" width="74" height="26" rx="4" />
    <rect x="380" y="368" width="74" height="26" rx="4" />
    <rect x="460" y="368" width="74" height="26" rx="4" />
  </g>
  <g class="muted" font-size="9">
    <text x="66" y="352">NLV</text>
    <text x="146" y="352">Daily</text>
    <text x="226" y="352">Unreal.</text>
    <text x="306" y="352">Realized</text>
    <text x="386" y="352">Cash</text>
    <text x="466" y="352">Gross</text>
    <text x="66" y="384">Buying</text>
    <text x="146" y="384">Avail.</text>
    <text x="226" y="384">Excess</text>
    <text x="306" y="384">Init Mgn</text>
    <text x="386" y="384">Maint</text>
    <text x="466" y="384">Equity</text>
  </g>

  <line class="arrow" x1="576" y1="344" x2="622" y2="344" />

  <rect class="panel-after" x="632" y="270" width="536" height="148" />
  <text class="sec" x="650" y="292">
    2. PORTFOLIO — SINGLE OUTER BORDER, CLEAN STAT GRID
  </text>
  <rect
    class="subbox"
    x="650"
    y="304"
    width="500"
    height="100"
    stroke="#58c47c"
    stroke-opacity="0.6"
    stroke-width="1.5"
  />
  <text class="txt" x="662" y="321" font-size="11" font-weight="600">
    Summary
  </text>
  <line x1="650" y1="328" x2="1150" y2="328" stroke="#2b3548" />
  <!-- 6x2 borderless stat cells -->
  <g class="muted" font-size="9.5">
    <text x="664" y="346">NLV</text>
    <text x="744" y="346">Daily</text>
    <text x="824" y="346">Unreal.</text>
    <text x="904" y="346">Realized</text>
    <text x="984" y="346">Cash</text>
    <text x="1064" y="346">Gross</text>
    <text x="664" y="378">Buying</text>
    <text x="744" y="378">Avail.</text>
    <text x="824" y="378">Excess</text>
    <text x="904" y="378">Init Mgn</text>
    <text x="984" y="378">Maint</text>
    <text x="1064" y="378">Equity</text>
  </g>
  <g class="txt" font-size="11" font-weight="700">
    <text x="664" y="360">$—</text>
    <text x="744" y="360">$—</text>
    <text x="824" y="360">$—</text>
    <text x="904" y="360">$—</text>
    <text x="984" y="360">$—</text>
    <text x="1064" y="360">$—</text>
    <text x="664" y="392">$—</text>
    <text x="744" y="392">$—</text>
    <text x="824" y="392">$—</text>
    <text x="904" y="392">$—</text>
    <text x="984" y="392">$—</text>
    <text x="1064" y="392">$—</text>
  </g>

  <!-- ================= ROW 3: PICK LISTS ================= -->
  <rect class="panel" x="32" y="434" width="536" height="114" />
  <text class="sec" x="50" y="456">
    3. PICK LISTS — DUPLICATE TOP NOTICE WITH EM-DASH (2×)
  </text>
  <rect class="subbox" x="50" y="466" width="500" height="70" />
  <text class="txt" x="64" y="485" font-weight="700">Pick lists</text>
  <text class="mono-bad" x="64" y="504">
    Research only — not an order. A pick, a gate or a quadrant never…
  </text>
  <line
    x1="64"
    y1="514"
    x2="536"
    y2="514"
    stroke="#242d3d"
    stroke-dasharray="4 3"
  />
  <text class="muted" x="64" y="528">
    Shell footer: Research only: nothing here authorizes a trade.
  </text>

  <line class="arrow" x1="576" y1="491" x2="622" y2="491" />

  <rect class="panel-after" x="632" y="434" width="536" height="114" />
  <text class="sec" x="650" y="456">
    3. PICK LISTS — SINGLE SHELL NOTICE (1×, NO EM-DASH)
  </text>
  <rect class="subbox" x="650" y="466" width="500" height="70" />
  <text class="txt" x="664" y="485" font-weight="700">Pick lists</text>
  <text class="muted" x="664" y="503">
    [Proposal panel · Import panel · Pick list cards]
  </text>
  <line
    x1="664"
    y1="514"
    x2="1136"
    y2="514"
    stroke="#242d3d"
    stroke-dasharray="4 3"
  />
  <text class="mono-ok" x="664" y="528">
    Shell footer: Research only: nothing here authorizes a trade.
  </text>

  <!-- ================= ROW 4: PAPERS, CHARTS & RISK ALLOCATOR ================= -->
  <rect class="panel" x="32" y="564" width="536" height="128" />
  <text class="sec" x="50" y="586">
    4. PAPERS, CHARTS &amp; RISK ALLOCATOR — TOKENS
  </text>
  <rect class="subbox" x="50" y="596" width="500" height="84" />
  <text class="muted" x="64" y="616">Papers:</text>
  <text class="mono-bad" x="128" y="616">
    No PDF retained (no_free_copy) · (free_copy_unreachable)
  </text>
  <text class="muted" x="64" y="640">Charts:</text>
  <text class="mono-bad" x="128" y="640">
    Order-flow marks (stored IBKR flow_events)
  </text>
  <text class="muted" x="64" y="664">Risk caps:</text>
  <text class="mono-keep" x="128" y="664">
    market-watch-bot (market_watch/premium_caps.py)
  </text>

  <line class="arrow" x1="576" y1="628" x2="622" y2="628" />

  <rect class="panel-after" x="632" y="564" width="536" height="128" />
  <text class="sec" x="650" y="586">
    4. PAPERS, CHARTS (WORDS) · RISK ALLOCATOR (NAME KEPT)
  </text>
  <rect class="subbox" x="650" y="596" width="500" height="84" />
  <text class="muted" x="664" y="616">Papers:</text>
  <text class="mono-ok" x="728" y="616">
    No PDF retained (no free copy) · (free copy unreachable)
  </text>
  <text class="muted" x="664" y="640">Charts:</text>
  <text class="mono-ok" x="728" y="640">
    Order-flow marks (stored IBKR flow events)
  </text>
  <text class="muted" x="664" y="664">Risk caps:</text>
  <text class="mono-keep" x="728" y="664">
    market-watch-bot (market_watch/premium_caps.py) [name kept]
  </text>
</svg>
