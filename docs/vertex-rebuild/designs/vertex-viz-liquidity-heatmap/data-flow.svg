<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1160 400"
  width="1160"
  height="400"
  font-family="ui-sans-serif, system-ui, -apple-system, sans-serif"
>
  <title>Data flow diagram of CME L2 liquidity heatmap pipeline</title>
  <defs>
    <linearGradient id="dfbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="100%" stop-color="#111622" />
    </linearGradient>
    <marker
      id="arr"
      viewBox="0 0 10 10"
      refX="8"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M0,1 L9,5 L0,9 z" fill="#eab308" />
    </marker>
    <marker
      id="arrMuted"
      viewBox="0 0 10 10"
      refX="8"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M0,1 L9,5 L0,9 z" fill="#64748b" />
    </marker>
  </defs>
  <rect width="1160" height="400" fill="url(#dfbg)" />
  <text x="32" y="38" fill="#f8fafc" font-size="20" font-weight="700">
    L2 Depth Recording &amp; Heatmap Read Pipeline (Read-Only)
  </text>
  <text x="32" y="60" fill="#94a3b8" font-size="12">
    2 of 3 IBKR market-depth slots (ES + NQ) · /etc/vertex-history/depth-off
    kill switch · 1-min sampled fallback
  </text>

  <!-- Stage 1: IBKR Gateway -->
  <rect
    x="32"
    y="96"
    width="175"
    height="196"
    rx="10"
