    IBKR CME L2
  </text>
  <text x="120" y="144" fill="#94a3b8" font-size="11" text-anchor="middle">
    ib-gateway :4003
  </text>
  <rect
    x="48"
    y="164"
    width="143"
    height="36"
    rx="6"
    fill="#1e293b"
    stroke="#eab308"
