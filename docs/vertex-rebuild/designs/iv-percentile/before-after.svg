      1y low (rank 0)
    </text>
    <!-- 252d curve -->
    <path
      d="M 38 152 C 78 148, 102 158, 138 140 S 196 162, 232 146 S 290 112, 336 128 S 395 144, 434 126 L 474 118"
      fill="none"
      stroke="url(#goldGrad)"
      stroke-width="2.5"
    />
    <circle
      cx="474"
      cy="118"
      r="5"
      fill="#f0c85a"
      stroke="#0b0f17"
      stroke-width="2"
    />

    <!-- ETF -> Proxy mapping pills -->
    <g
      transform="translate(24, 194)"
      font-family="system-ui, sans-serif"
      font-size="12"
      font-weight="600"
    >
      <rect
        x="0"
        y="0"
        width="110"
        height="44"
        rx="8"
        fill="#0d131f"
        stroke="#334155"
      />
      <text x="14" y="19" fill="#f8fafc">SPY</text>
      <text x="54" y="19" fill="#e5b84b">→ VIX</text>
      <text x="14" y="35" fill="#94a3b8" font-size="10" font-weight="400">
        252d proxy
      </text>

      <rect
        x="119"
        y="0"
        width="110"
        height="44"
        rx="8"
        fill="#0d131f"
        stroke="#c99b2e"
      />
      <text x="133" y="19" fill="#f8fafc">QQQ</text>
      <text x="171" y="19" fill="#f0c85a">→ VXN</text>
      <text x="133" y="35" fill="#94a3b8" font-size="10" font-weight="400">
        252d proxy
      </text>

      <rect
        x="238"
        y="0"
        width="110"
        height="44"
        rx="8"
        fill="#0d131f"
        stroke="#334155"
      />
      <text x="252" y="19" fill="#f8fafc">IWM</text>
      <text x="290" y="19" fill="#e5b84b">→ RVX</text>
      <text x="252" y="35" fill="#94a3b8" font-size="10" font-weight="400">
        252d proxy
      </text>

      <rect
        x="357"
        y="0"
        width="111"
        height="44"
        rx="8"
        fill="#0d131f"
        stroke="#334155"
      />
      <text x="371" y="19" fill="#f8fafc">DIA</text>
      <text x="408" y="19" fill="#e5b84b">→ VXD</text>
      <text x="371" y="35" fill="#94a3b8" font-size="10" font-weight="400">
        252d proxy
      </text>
    </g>

    <!-- Working gauge + dual output -->
    <g transform="translate(34, 260)">
      <path
        d="M 16 106 A 92 92 0 0 1 200 106"
        fill="none"
        stroke="#1e293b"
        stroke-width="16"
        stroke-linecap="round"
      />
      <path
        d="M 16 106 A 92 92 0 0 1 174 42"
        fill="none"
        stroke="url(#gaugeGrad)"
        stroke-width="16"
        stroke-linecap="round"
      />
      <!-- Needle pointing ~78th percentile -->
      <line
        x1="108"
        y1="106"
        x2="168"
        y2="50"
        stroke="#f8fafc"
        stroke-width="3"
        stroke-linecap="round"
      />
      <circle cx="108" cy="106" r="6" fill="#f0c85a" />
      <text
        x="108"
        y="134"
        text-anchor="middle"
        fill="#f8fafc"
        font-family="system-ui, sans-serif"
        font-size="14"
        font-weight="700"
      >
        1y Pctl &amp; Rank (0–100)
      </text>
      <text
        x="108"
        y="152"
        text-anchor="middle"
        fill="#94a3b8"
        font-family="system-ui, sans-serif"
        font-size="11"
      >
        Illustrative gauge (MOCK)
      </text>

      <!-- Dual breakdown badge -->
      <g transform="translate(226, 12)">
        <rect
          width="222"
          height="66"
          rx="8"
          fill="#0d131f"
          stroke="#22c55e"
          stroke-width="1"
        />
        <text
          x="12"
          y="21"
          fill="#86efac"
          font-family="system-ui, sans-serif"
          font-size="12"
          font-weight="700"
        >
          Selected: vol_index_proxy
        </text>
        <text
          x="12"
          y="39"
          fill="#e2e8f0"
          font-family="system-ui, sans-serif"
          font-size="11"
        >
          proxyIndex · window: 252 · asOf
        </text>
        <text
          x="12"
          y="55"
          fill="#94a3b8"
          font-family="system-ui, sans-serif"
          font-size="11"
        >
          Auto-switches to own at 252d
        </text>

        <rect
          y="80"
          width="222"
          height="66"
          rx="8"
          fill="#0d131f"
          stroke="#475569"
          stroke-width="1"
        />
        <text
          x="12"
          y="101"
          fill="#fbbf24"
          font-family="system-ui, sans-serif"
          font-size="12"
          font-weight="700"
        >
          Own basis (&lt; 252d): null
        </text>
        <text
          x="12"
          y="119"
          fill="#cbd5e1"
          font-family="system-ui, sans-serif"
          font-size="11"
        >
          ivPercentile: null · ivRank: null
        </text>
        <text
          x="12"
          y="135"
          fill="#94a3b8"
          font-family="system-ui, sans-serif"
          font-size="10"
        >
          Needs 252 sessions with ATM IV (9 stored)
        </text>
      </g>
    </g>

    <!-- Bottom guarantee strip -->
    <text
      x="24"
      y="448"
      fill="#94a3b8"
      font-family="system-ui, sans-serif"
      font-size="12"
    >
      Also covers Core 7 (GLD→GVZ, SLV→VXSLV, USO→OVX) · Research read-only
    </text>
  </g>
</svg>
