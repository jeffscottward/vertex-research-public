<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 620"
  width="1200"
  height="620"
  role="img"
  aria-label="Before and after comparison for Vertex 1-year ETF IV percentile and IV rank"
>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f17" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c99b2e" />
      <stop offset="100%" stop-color="#f0c85a" />
    </linearGradient>
    <linearGradient id="gaugeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <marker
      id="arrowGold"
      viewBox="0 0 10 10"
      refX="8"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M0 1 L10 5 L0 9 z" fill="#e5b84b" />
    </marker>
    <marker
      id="arrowRed"
      viewBox="0 0 10 10"
      refX="8"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M0 1 L10 5 L0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <rect width="1200" height="620" fill="url(#bg)" />

  <!-- Header -->
  <text
    x="48"
    y="52"
    fill="#f8fafc"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="24"
    font-weight="700"
  >
    1-Year ETF IV Percentile &amp; IV Rank (Consult Gap 8)
  </text>
  <text
    x="48"
    y="78"
    fill="#94a3b8"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="14"
  >
    Never from 9 sessions · 252-session window · Explicit basis (own ATM IV vs
    Cboe vol-index proxy)
  </text>
  <rect x="48" y="92" width="1104" height="2" fill="#1e293b" />

  <!-- LEFT PANEL: BEFORE -->
  <g transform="translate(48, 114)">
    <rect
      width="516"
      height="466"
      rx="14"
      fill="#131a26"
      stroke="#334155"
      stroke-width="1.5"
    />
    <rect width="516" height="44" rx="14" fill="#2a161b" />
    <rect y="30" width="516" height="14" fill="#2a161b" />
    <circle cx="24" cy="22" r="7" fill="#ef4444" />
    <text
      x="42"
      y="27"
      fill="#fecaca"
      font-family="system-ui, sans-serif"
      font-size="16"
      font-weight="700"
    >
      BEFORE · Blind on 1-year IV standing
    </text>

    <!-- 9-session stub bar chart -->
    <text
      x="24"
      y="78"
      fill="#cbd5e1"
      font-family="system-ui, sans-serif"
      font-size="13"
      font-weight="600"
    >
      openbb_option_iv_daily (9 of 252 sessions)
    </text>
    <rect
      x="24"
      y="92"
      width="468"
      height="72"
      rx="8"
      fill="#0d131f"
      stroke="#1e293b"
    />
    <!-- 252-day ruler background -->
    <line
      x1="38"
      y1="146"
      x2="478"
      y2="146"
      stroke="#334155"
      stroke-width="1.5"
      stroke-dasharray="4 4"
    />
    <!-- 9 tiny bars on the right edge -->
    <g fill="#64748b">
      <rect x="440" y="128" width="3" height="18" rx="1" />
      <rect x="444" y="124" width="3" height="22" rx="1" />
      <rect x="448" y="130" width="3" height="16" rx="1" />
      <rect x="452" y="122" width="3" height="24" rx="1" />
      <rect x="456" y="118" width="3" height="28" rx="1" />
      <rect x="460" y="114" width="3" height="32" rx="1" />
      <rect x="464" y="116" width="3" height="30" rx="1" />
      <rect x="468" y="110" width="3" height="36" rx="1" />
      <rect x="472" y="106" width="3" height="40" rx="1" fill="#f59e0b" />
    </g>
    <text
      x="40"
      y="124"
      fill="#64748b"
      font-family="system-ui, sans-serif"
      font-size="12"
