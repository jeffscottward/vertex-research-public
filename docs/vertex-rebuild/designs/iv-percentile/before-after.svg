      252-session window (own ≥ 252d else Cboe proxy ≥ 252d)
    </text>
    <rect
      x="24"
      y="92"
      width="468"
      height="86"
      rx="8"
      fill="#0d131f"
      stroke="#293548"
    />
    <!-- 1y min/max band -->
    <line
      x1="38"
      y1="108"
      x2="478"
      y2="108"
      stroke="#ef4444"
      stroke-width="1"
      stroke-dasharray="3 3"
      opacity="0.7"
    />
    <line
      x1="38"
      y1="164"
      x2="478"
      y2="164"
      stroke="#22c55e"
      stroke-width="1"
      stroke-dasharray="3 3"
      opacity="0.7"
    />
    <text
      x="40"
      y="104"
      fill="#fca5a5"
      font-family="system-ui, sans-serif"
      font-size="10"
