      243 missing trading sessions
    </text>
    <text
      x="430"
      y="159"
      fill="#f59e0b"
      font-family="system-ui, sans-serif"
      font-size="11"
      font-weight="600"
    >
      9d
    </text>

    <!-- Unused 30-day load of long vol index history -->
    <text
      x="24"
      y="194"
      fill="#cbd5e1"
      font-family="system-ui, sans-serif"
      font-size="13"
      font-weight="600"
    >
      market_daily_series (VIX 9,291d · VXN 6,495d · RVX · VXD)
    </text>
    <rect
      x="24"
      y="206"
      width="468"
      height="54"
      rx="8"
      fill="#0d131f"
      stroke="#1e293b"
    />
    <path
      d="M 38 242 Q 95 224, 150 238 T 270 226 T 380 236 T 432 230"
      fill="none"
      stroke="#334155"
      stroke-width="2"
    />
    <rect
      x="432"
      y="214"
      width="48"
      height="38"
      rx="4"
      fill="#1e293b"
      stroke="#64748b"
      stroke-dasharray="3 2"
    />
    <path
      d="M 436 232 L 452 224 L 466 229 L 476 220"
      fill="none"
      stroke="#94a3b8"
      stroke-width="2"
    />
    <text
      x="42"
      y="226"
      fill="#64748b"
      font-family="system-ui, sans-serif"
      font-size="11"
    >
      Ignored (volContext only loaded 30 calendar days)
    </text>

    <!-- Broken gauge / question mark -->
    <line
      x1="258"
      y1="268"
      x2="258"
      y2="304"
      stroke="#ef4444"
      stroke-width="2"
      marker-end="url(#arrowRed)"
    />
    <g transform="translate(118, 314)">
      <path
        d="M 20 96 A 120 120 0 0 1 260 96"
        fill="none"
        stroke="#1e293b"
        stroke-width="18"
        stroke-linecap="round"
      />
      <text
        x="140"
        y="84"
        text-anchor="middle"
        fill="#ef4444"
        font-family="system-ui, sans-serif"
        font-size="44"
        font-weight="800"
      >
        ?
      </text>
      <text
        x="140"
        y="114"
        text-anchor="middle"
        fill="#f87171"
        font-family="system-ui, sans-serif"
        font-size="14"
        font-weight="600"
      >
        QQQ IV 32% → ivPercentile: null
      </text>
      <text
        x="140"
        y="134"
        text-anchor="middle"
        fill="#94a3b8"
        font-family="system-ui, sans-serif"
        font-size="12"
      >
        No IV rank · No proxy · Min was only 20d (1 mo)
      </text>
    </g>
  </g>

  <!-- Center Arrow -->
  <g transform="translate(574, 336)">
    <line
      x1="0"
      y1="0"
      x2="48"
      y2="0"
      stroke="#e5b84b"
      stroke-width="3"
      marker-end="url(#arrowGold)"
    />
  </g>

  <!-- RIGHT PANEL: AFTER -->
