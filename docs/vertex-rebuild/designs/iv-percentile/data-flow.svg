<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 480"
  width="1200"
  height="480"
  role="img"
  aria-label="Data flow for 1-year IV percentile and IV rank in openbb.volContext"
>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f17" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker
      id="arr"
      viewBox="0 0 10 10"
      refX="8"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M0 1 L10 5 L0 9 z" fill="#e5b84b" />
    </marker>
    <marker
      id="arrGray"
      viewBox="0 0 10 10"
      refX="8"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M0 1 L10 5 L0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <rect width="1200" height="480" fill="url(#bg2)" />
  <text
    x="44"
    y="46"
    fill="#f8fafc"
