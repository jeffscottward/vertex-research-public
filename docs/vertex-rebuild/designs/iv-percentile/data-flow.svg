    </text>
    <rect
      x="126"
      y="68"
      width="96"
      height="40"
      rx="6"
      fill="#2a161b"
      stroke="#ef4444"
    />
    <text
      x="174"
      y="86"
      text-anchor="middle"
      fill="#fca5a5"
      font-family="system-ui, sans-serif"
      font-size="11"
      font-weight="700"
    >
      NO (&lt; 252)
    </text>
    <text
      x="174"
      y="101"
      text-anchor="middle"
      fill="#fecaca"
      font-family="system-ui, sans-serif"
      font-size="10"
    >
      null + reason
    </text>

