    Two separate 252-session calculations (never mixed) → explicit selected
    basis → oRPC, MCP, and /markets
  </text>

  <!-- Column 1: Postgres Sources -->
  <g transform="translate(44, 108)">
    <!-- Cylinder 1: openbb_option_iv_daily -->
    <rect
      width="236"
      height="126"
      rx="12"
      fill="#131a26"
      stroke="#3b82f6"
      stroke-width="1.5"
    />
    <ellipse cx="118" cy="22" rx="34" ry="8" fill="#1e3a5f" stroke="#60a5fa" />
    <path
      d="M 84 22 L 84 40 A 34 8 0 0 0 152 40 L 152 22"
      fill="none"
      stroke="#60a5fa"
    />
    <text
      x="118"
      y="68"
      text-anchor="middle"
      fill="#f8fafc"
      font-family="system-ui, sans-serif"
      font-size="14"
      font-weight="700"
    >
      openbb_option_iv_daily
    </text>
    <text
      x="118"
      y="88"
      text-anchor="middle"
      fill="#93c5fd"
      font-family="system-ui, sans-serif"
      font-size="12"
