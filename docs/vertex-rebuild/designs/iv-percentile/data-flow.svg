      atm_iv_30d (decimal)
    </text>
    <text
      x="118"
      y="108"
      text-anchor="middle"
      fill="#94a3b8"
      font-family="system-ui, sans-serif"
      font-size="11"
    >
      Newest 252 rows / ETF
    </text>

    <!-- Cylinder 2: market_daily_series -->
    <g transform="translate(0, 174)">
      <rect
        width="236"
        height="134"
        rx="12"
        fill="#131a26"
        stroke="#c99b2e"
        stroke-width="1.5"
      />
      <ellipse
        cx="118"
        cy="22"
        rx="34"
        ry="8"
        fill="#3a2d12"
        stroke="#f0c85a"
      />
      <path
        d="M 84 22 L 84 40 A 34 8 0 0 0 152 40 L 152 22"
        fill="none"
        stroke="#f0c85a"
      />
      <text
        x="118"
        y="68"
        text-anchor="middle"
        fill="#f8fafc"
        font-family="system-ui, sans-serif"
        font-size="14"
        font-weight="700"
      >
        market_daily_series
      </text>
      <text
        x="118"
        y="88"
        text-anchor="middle"
        fill="#fde68a"
        font-family="system-ui, sans-serif"
        font-size="12"
