      1. own ready → own_atm_iv
    </text>
    <text
      x="106"
      y="96"
      text-anchor="middle"
      fill="#f0c85a"
      font-family="system-ui, sans-serif"
      font-size="12"
      font-weight="600"
    >
      2. else proxy → vol_index_proxy
    </text>
    <text
      x="106"
      y="128"
      text-anchor="middle"
      fill="#fca5a5"
      font-family="system-ui, sans-serif"
      font-size="12"
      font-weight="600"
    >
      3. else → null + reasons
    </text>
    <line x1="20" y1="146" x2="192" y2="146" stroke="#334155" />
    <text
      x="106"
      y="168"
      text-anchor="middle"
      fill="#94a3b8"
      font-family="system-ui, sans-serif"
      font-size="11"
    >
      Both own &amp; proxy attached
    </text>
  </g>

  <!-- Arrows Col 3 -> Col 4 -->
  <path
    d="M 884 220 L 928 164"
    fill="none"
    stroke="#e5b84b"
    stroke-width="2"
    marker-end="url(#arr)"
  />
  <line
    x1="884"
    y1="260"
    x2="928"
    y2="260"
    stroke="#e5b84b"
    stroke-width="2"
    marker-end="url(#arr)"
  />
  <path
    d="M 884 300 L 928 356"
    fill="none"
    stroke="#e5b84b"
    stroke-width="2"
    marker-end="url(#arr)"
  />

  <!-- Column 4: Consumers -->
  <g transform="translate(936, 118)" font-family="system-ui, sans-serif">
    <rect width="220" height="82" rx="10" fill="#131a26" stroke="#334155" />
    <text x="16" y="28" fill="#f8fafc" font-size="14" font-weight="700">
      oRPC openbb.volContext
    </text>
    <text x="16" y="48" fill="#cbd5e1" font-size="11">
      ivOneYear[] + ivDaily[]
    </text>
    <text x="16" y="66" fill="#94a3b8" font-size="11">
      Agent read key &amp; session
    </text>

    <rect
      y="102"
      width="220"
      height="82"
      rx="10"
      fill="#131a26"
      stroke="#334155"
    />
    <text x="16" y="130" fill="#f8fafc" font-size="14" font-weight="700">
      MCP openbb_vol_context
    </text>
    <text x="16" y="150" fill="#cbd5e1" font-size="11">
      Consults &amp; research tools
    </text>
    <text x="16" y="168" fill="#94a3b8" font-size="11">
      Rates QQQ/SPY/IWM/DIA 1y IV
    </text>

    <rect
      y="204"
      width="220"
      height="82"
      rx="10"
      fill="#131a26"
      stroke="#334155"
    />
    <text x="16" y="232" fill="#f8fafc" font-size="14" font-weight="700">
      /markets Core 7 IV Table
    </text>
    <text x="16" y="252" fill="#cbd5e1" font-size="11">
      IV pctl / rank (1y) + 1y basis
    </text>
    <text x="16" y="270" fill="#94a3b8" font-size="11">
      Basis + sessions + as-of date
    </text>
  </g>
</svg>
