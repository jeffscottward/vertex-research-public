      <text
        x="66"
        y="106"
        text-anchor="middle"
        fill="#bbf7d0"
        font-family="system-ui, sans-serif"
        font-size="10"
      >
        pctl + rank
      </text>
      <rect
        x="126"
        y="72"
        width="96"
        height="44"
        rx="6"
        fill="#2a161b"
        stroke="#ef4444"
      />
      <text
        x="174"
        y="90"
        text-anchor="middle"
        fill="#fca5a5"
        font-family="system-ui, sans-serif"
        font-size="11"
        font-weight="700"
      >
        NO (&lt; 252)
      </text>
      <text
        x="174"
        y="106"
        text-anchor="middle"
        fill="#fecaca"
        font-family="system-ui, sans-serif"
        font-size="10"
      >
        null + reason
      </text>
    </g>
