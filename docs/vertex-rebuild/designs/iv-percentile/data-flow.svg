      <rect
        width="240"
        height="134"
        rx="12"
        fill="#131a26"
        stroke="#c99b2e"
        stroke-width="1.5"
      />
      <text
        x="120"
        y="30"
        text-anchor="middle"
        fill="#fde68a"
        font-family="system-ui, sans-serif"
        font-size="14"
        font-weight="700"
