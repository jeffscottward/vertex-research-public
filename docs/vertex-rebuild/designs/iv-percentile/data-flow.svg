  <path
    d="M 588 349 L 638 349 L 638 278 L 664 278"
    fill="none"
    stroke="#e5b84b"
    stroke-width="2"
    marker-end="url(#arr)"
  />

  <!-- Column 3: Basis Selector -->
  <g transform="translate(672, 166)">
    <rect
      width="212"
      height="188"
      rx="14"
      fill="#182132"
      stroke="#f0c85a"
      stroke-width="2"
    />
    <text
      x="106"
      y="32"
      text-anchor="middle"
      fill="#f8fafc"
      font-family="system-ui, sans-serif"
      font-size="15"
      font-weight="700"
    >
      Select 1y Basis
    </text>
    <text
      x="106"
      y="64"
      text-anchor="middle"
      fill="#93c5fd"
      font-family="system-ui, sans-serif"
      font-size="12"
      font-weight="600"
