      </text>
      <rect
        x="18"
        y="72"
        width="96"
        height="44"
        rx="6"
        fill="#172b20"
        stroke="#22c55e"
      />
      <text
        x="66"
        y="90"
        text-anchor="middle"
        fill="#86efac"
        font-family="system-ui, sans-serif"
        font-size="11"
        font-weight="700"
