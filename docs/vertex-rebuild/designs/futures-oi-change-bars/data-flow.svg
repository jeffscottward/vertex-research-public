  <title>
    Data flow: a timer job on the rig reads one workbook per trading day from
    the CME public FTP server, posts rows through openbb.ingest into two daily
    series in Postgres, and the /charts page reads them with openbb.macro and
    draws the change per trading day. Not used: the CME website, the broker
    connection, orders, arming, risk settings, a new database table.
  </title>
