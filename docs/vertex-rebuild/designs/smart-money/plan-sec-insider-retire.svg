<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 760"
  width="1200"
  height="760"
  font-family="Inter, 'Segoe UI', Arial, sans-serif"
  role="img"
  aria-labelledby="t d"
>
  <title id="t">
    Before and after: the retired sec-insider job and its frozen table are
    removed
  </title>
  <desc id="d">
    Before: the scheduled sec-form4 job feeds four Form 4 tables that the app
    reads, while the unscheduled sec-insider job and its frozen table of 363
    rows remain. After: only the sec-form4 path remains and the 363 rows are in
    a verified backup. A timeline shows the five rollout steps.
  </desc>
  <defs>
    <marker
      id="a"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M0 0L10 5L0 10z" fill="#d4af37" />
    </marker>
    <marker
      id="g"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M0 0L10 5L0 10z" fill="#5b6472" />
    </marker>
    <g id="cyl">
      <path
        d="M0 12v56c0 7 16 12 36 12s36-5 36-12V12"
        fill="#1b2230"
        stroke="currentColor"
        stroke-width="2.5"
      />
      <ellipse
        cx="36"
        cy="12"
        rx="36"
        ry="12"
        fill="#232c3d"
        stroke="currentColor"
        stroke-width="2.5"
      />
      <path
        d="M0 34c0 7 16 12 36 12s36-5 36-12M0 54c0 7 16 12 36 12s36-5 36-12"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        opacity=".55"
      />
    </g>
    <g id="clock">
      <circle
        cx="30"
        cy="30"
        r="27"
        fill="#1b2230"
        stroke="currentColor"
        stroke-width="3"
      />
      <path
        d="M30 13v17l11 8"
        fill="none"
        stroke="currentColor"
        stroke-width="3"
        stroke-linecap="round"
      />
    </g>
    <g id="screen">
      <rect
        x="0"
        y="0"
        width="92"
        height="62"
        rx="7"
        fill="#1b2230"
        stroke="currentColor"
        stroke-width="2.5"
      />
      <path
        d="M12 44l16-14 12 8 16-20 22 14"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linejoin="round"
      />
      <path d="M32 74h28M46 62v12" stroke="currentColor" stroke-width="2.5" />
    </g>
  </defs>
  <rect width="1200" height="760" fill="#0e1218" />
  <text x="40" y="48" fill="#f2f4f7" font-size="26" font-weight="700">
    Form 4 insider data: remove the retired job and its frozen table
  </text>

  <!-- BEFORE -->
  <rect
    x="30"
    y="72"
    width="560"
    height="430"
    rx="16"
    fill="#131924"
    stroke="#2a3344"
  />
  <text
    x="54"
    y="108"
    fill="#9aa4b2"
    font-size="18"
    font-weight="700"
    letter-spacing="2"
  >
    BEFORE
  </text>

  <g color="#d4af37" transform="translate(64,140)"><use href="#clock" /></g>
  <text x="94" y="222" fill="#f2f4f7" font-size="16" text-anchor="middle">
    sec-form4
  </text>
  <text x="94" y="242" fill="#9aa4b2" font-size="13" text-anchor="middle">
    scheduled
  </text>
  <path
    d="M132 170H250"
    stroke="#d4af37"
    stroke-width="3"
    marker-end="url(#a)"
  />
  <g color="#d4af37">
    <use href="#cyl" transform="translate(262,122) scale(.62)" />
    <use href="#cyl" transform="translate(312,122) scale(.62)" />
    <use href="#cyl" transform="translate(262,178) scale(.62)" />
    <use href="#cyl" transform="translate(312,178) scale(.62)" />
  </g>
  <text x="310" y="252" fill="#f2f4f7" font-size="15" text-anchor="middle">
    4 Form 4 tables
  </text>
  <text x="310" y="271" fill="#9aa4b2" font-size="13" text-anchor="middle">
    31 index days
  </text>
  <path
    d="M368 170H452"
    stroke="#d4af37"
    stroke-width="3"
    marker-end="url(#a)"
  />
  <g color="#f2f4f7" transform="translate(464,138)"><use href="#screen" /></g>
  <text x="510" y="238" fill="#f2f4f7" font-size="15" text-anchor="middle">
    app reads
  </text>

  <g color="#5b6472" transform="translate(64,330)">
    <use href="#clock" />
    <path
      d="M4 4l52 52"
      stroke="#e5484d"
      stroke-width="4"
      stroke-linecap="round"
    />
  </g>
  <text x="94" y="412" fill="#c9cfd8" font-size="16" text-anchor="middle">
    sec-insider
  </text>
  <text x="94" y="432" fill="#e5484d" font-size="13" text-anchor="middle">
    not scheduled
  </text>
  <path
    d="M132 360H250"
    stroke="#5b6472"
    stroke-width="3"
    stroke-dasharray="7 7"
    marker-end="url(#g)"
  />
  <g color="#5b6472" transform="translate(274,316)"><use href="#cyl" /></g>
  <path
    d="M296 356l6-10 6 10 6-10 6 10 6-10"
    fill="none"
    stroke="#8fd3ff"
    stroke-width="2"
    opacity=".9"
  />
  <text x="310" y="420" fill="#c9cfd8" font-size="15" text-anchor="middle">
    frozen table
  </text>
  <text x="310" y="440" fill="#9aa4b2" font-size="13" text-anchor="middle">
    363 rows, 8 symbols
  </text>
  <text x="310" y="458" fill="#9aa4b2" font-size="13" text-anchor="middle">
    no writer since PR 3
  </text>
  <path
    d="M368 360H452"
    stroke="#5b6472"
    stroke-width="3"
    stroke-dasharray="7 7"
  />
  <text x="470" y="366" fill="#e5484d" font-size="26" font-weight="700">×</text>

  <!-- AFTER -->
  <rect
    x="610"
    y="72"
    width="560"
    height="430"
    rx="16"
    fill="#131924"
    stroke="#2a3344"
  />
  <text
    x="634"
    y="108"
    fill="#d4af37"
    font-size="18"
    font-weight="700"
    letter-spacing="2"
  >
    AFTER
  </text>

  <g color="#d4af37" transform="translate(644,140)"><use href="#clock" /></g>
  <text x="674" y="222" fill="#f2f4f7" font-size="16" text-anchor="middle">
    sec-form4
  </text>
  <text x="674" y="242" fill="#9aa4b2" font-size="13" text-anchor="middle">
    scheduled
  </text>
  <path
    d="M712 170H830"
    stroke="#d4af37"
    stroke-width="3"
    marker-end="url(#a)"
  />
  <g color="#d4af37">
    <use href="#cyl" transform="translate(842,122) scale(.62)" />
    <use href="#cyl" transform="translate(892,122) scale(.62)" />
    <use href="#cyl" transform="translate(842,178) scale(.62)" />
    <use href="#cyl" transform="translate(892,178) scale(.62)" />
  </g>
  <text x="890" y="252" fill="#f2f4f7" font-size="15" text-anchor="middle">
    4 Form 4 tables
  </text>
  <path
    d="M948 170H1032"
    stroke="#d4af37"
    stroke-width="3"
    marker-end="url(#a)"
  />
  <g color="#f2f4f7" transform="translate(1044,138)"><use href="#screen" /></g>
  <text x="1090" y="238" fill="#f2f4f7" font-size="15" text-anchor="middle">
    app reads
  </text>

  <g transform="translate(846,318)">
    <path
      d="M0 0h52l20 20v72H0z"
      fill="#1b2230"
      stroke="#3ecf8e"
      stroke-width="2.5"
    />
    <path d="M52 0v20h20" fill="none" stroke="#3ecf8e" stroke-width="2.5" />
    <path
      d="M18 56l12 12 24-26"
      fill="none"
      stroke="#3ecf8e"
      stroke-width="4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
  <text x="882" y="436" fill="#f2f4f7" font-size="15" text-anchor="middle">
    verified backup
  </text>
  <text x="882" y="456" fill="#9aa4b2" font-size="13" text-anchor="middle">
    363 rows, restore tested
  </text>
  <text x="674" y="372" fill="#5b6472" font-size="15" text-anchor="middle">
    job removed
  </text>
  <path d="M640 350h68" stroke="#5b6472" stroke-width="2" opacity=".0" />
  <text x="1090" y="372" fill="#5b6472" font-size="15" text-anchor="middle">
    table dropped
  </text>

  <!-- TIMELINE -->
  <text
    x="40"
    y="552"
    fill="#9aa4b2"
    font-size="18"
    font-weight="700"
    letter-spacing="2"
  >
    ROLLOUT ORDER
  </text>
  <path
    d="M90 620H1110"
    stroke="#2a3344"
    stroke-width="6"
    stroke-linecap="round"
  />
  <g font-size="15" text-anchor="middle">
    <g>
      <circle cx="110" cy="620" r="22" fill="#3ecf8e" />
      <path
        d="M100 620l8 8 14-16"
        fill="none"
        stroke="#0e1218"
        stroke-width="4"
        stroke-linecap="round"
      />
      <text x="110" y="672" fill="#f2f4f7">backup</text>
      <text x="110" y="692" fill="#9aa4b2" font-size="13">done, verified</text>
    </g>
    <g>
      <circle
        cx="360"
        cy="620"
        r="22"
        fill="#1b2230"
        stroke="#d4af37"
        stroke-width="3"
      />
      <text x="360" y="626" fill="#d4af37" font-weight="700">2</text>
      <text x="360" y="672" fill="#f2f4f7">merge on green CI</text>
    </g>
    <g>
      <circle
        cx="610"
        cy="620"
        r="22"
        fill="#1b2230"
        stroke="#d4af37"
        stroke-width="3"
      />
      <text x="610" y="626" fill="#d4af37" font-weight="700">3</text>
      <text x="610" y="672" fill="#f2f4f7">rig, then app</text>
      <text x="610" y="692" fill="#9aa4b2" font-size="13">after 13:15 ET</text>
    </g>
    <g>
      <circle
        cx="860"
        cy="620"
        r="22"
        fill="#1b2230"
        stroke="#e5484d"
        stroke-width="3"
      />
      <text x="860" y="626" fill="#e5484d" font-weight="700">4</text>
      <text x="860" y="672" fill="#f2f4f7">drop table</text>
      <text x="860" y="692" fill="#9aa4b2" font-size="13">migration 0102</text>
    </g>
    <g>
      <circle
        cx="1090"
        cy="620"
        r="22"
        fill="#1b2230"
        stroke="#d4af37"
        stroke-width="3"
      />
      <text x="1090" y="626" fill="#d4af37" font-weight="700">5</text>
      <text x="1090" y="672" fill="#f2f4f7">live checks</text>
    </g>
  </g>
</svg>
