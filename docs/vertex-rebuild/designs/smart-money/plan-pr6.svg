    price_freshness_state and price-alerts-ntfy. $0 new spend.
  </text>

  <!-- BEFORE -->
  <rect
    fill="#171a21"
    height="320"
    rx="14"
    stroke="#3a3f4a"
    width="520"
    x="40"
    y="98"
  />
  <text fill="#ff7b72" font-size="20" font-weight="700" x="64" y="132">
    BEFORE
  </text>

  <!-- Before pictogram 1: /smart-money single panel -->
  <rect
    fill="#21262d"
    height="62"
    rx="8"
    stroke="#484f58"
    width="120"
    x="64"
    y="152"
  />
  <rect
    fill="#d4af37"
    height="10"
    opacity="0.8"
    rx="3"
    width="100"
    x="74"
    y="164"
  />
  <rect fill="#6b7280" height="8" rx="3" width="76" x="74" y="182" />
  <rect fill="#6b7280" height="8" rx="3" width="58" x="74" y="196" />
  <text fill="#e6edf3" font-size="15" font-weight="600" x="200" y="176">
    /smart-money: options only
  </text>
  <text fill="#ff7b72" font-size="13" x="200" y="198">
    No insiders, Congress, or 13F lists
  </text>

  <!-- Before pictogram 2: /stock/[symbol]?tab=filings -->
  <rect
    fill="#21262d"
    height="62"
    rx="8"
    stroke="#484f58"
    width="120"
    x="64"
    y="232"
  />
  <line
    stroke="#9aa3ad"
    stroke-linecap="round"
    stroke-width="5"
    x1="76"
    x2="148"
    y1="250"
    y2="250"
  />
  <line
    stroke="#6b7280"
    stroke-linecap="round"
    stroke-width="5"
    x1="76"
    x2="164"
    y1="266"
    y2="266"
  />
  <line
    stroke="#6b7280"
    stroke-linecap="round"
    stroke-width="5"
    x1="76"
    x2="124"
    y1="282"
    y2="282"
  />
  <text fill="#e6edf3" font-size="15" font-weight="600" x="200" y="256">
