  </text>

  <line
    marker-end="url(#arr-gold)"
    stroke="#d4af37"
    stroke-width="3"
    x1="274"
    x2="322"
    y1="555"
    y2="555"
  />

  <!-- Node 2: openbb.status + checkSourceOverdue -->
  <rect
    fill="#0f1115"
    height="114"
    rx="10"
    stroke="#d4af37"
    width="240"
    x="330"
    y="498"
  />
  <text
    fill="#e6edf3"
    font-size="14"
    font-weight="700"
    text-anchor="middle"
    x="450"
    y="524"
  >
    Overdue Evaluator
  </text>
  <text fill="#9aa3ad" font-size="12" text-anchor="middle" x="450" y="548">
    openbb_ingest_runs + Form4 idx
  </text>
  <text fill="#9aa3ad" font-size="12" text-anchor="middle" x="450" y="568">
