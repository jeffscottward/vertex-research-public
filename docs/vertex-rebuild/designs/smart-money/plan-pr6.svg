      OPT
    </text>
    <text
      fill="#7ee787"
      font-size="10"
      font-weight="700"
      text-anchor="middle"
      x="92"
      y="19"
    >
      FORM4
    </text>
    <text
      fill="#58a6ff"
      font-size="10"
      font-weight="700"
      text-anchor="middle"
      x="28"
      y="53"
    >
      PTR
    </text>
    <text
      fill="#bc8cff"
      font-size="10"
      font-weight="700"
      text-anchor="middle"
      x="92"
      y="53"
    >
      13F
    </text>
