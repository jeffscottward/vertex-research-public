  </text>

  <!-- After pictogram 1: 4 distinct lists -->
  <g transform="translate(664, 150)">
    <rect
      fill="#21262d"
      height="28"
      rx="5"
      stroke="#d4af37"
      width="56"
      x="0"
      y="0"
    />
    <rect
      fill="#21262d"
      height="28"
      rx="5"
      stroke="#7ee787"
      width="56"
      x="64"
      y="0"
    />
    <rect
      fill="#21262d"
      height="28"
      rx="5"
      stroke="#58a6ff"
      width="56"
      x="0"
      y="34"
    />
    <rect
      fill="#21262d"
      height="28"
      rx="5"
      stroke="#bc8cff"
      width="56"
      x="64"
      y="34"
    />
    <text
      fill="#d4af37"
      font-size="10"
      font-weight="700"
      text-anchor="middle"
      x="28"
      y="19"
