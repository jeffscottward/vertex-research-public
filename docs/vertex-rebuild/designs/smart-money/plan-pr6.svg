    <circle cx="18" cy="18" fill="#d4af37" r="5" />
    <rect fill="#c9d1d9" height="7" rx="3" width="76" x="30" y="14" />
    <circle cx="18" cy="33" fill="#7ee787" r="5" />
    <rect fill="#c9d1d9" height="7" rx="3" width="66" x="30" y="29" />
    <circle cx="18" cy="48" fill="#58a6ff" r="5" />
