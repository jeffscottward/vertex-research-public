  </text>
  <text fill="#58a6ff" font-size="12" text-anchor="middle" x="741" y="568">
    monitor = "openbb-overdue"
  </text>
  <text fill="#9aa3ad" font-size="11" text-anchor="middle" x="741" y="592">
