  </text>

  <!-- Node 1: Registries -->
  <rect
    fill="#0f1115"
    height="114"
    rx="10"
    stroke="#484f58"
    width="210"
    x="64"
    y="498"
  />
  <text
    fill="#e6edf3"
    font-size="14"
    font-weight="700"
    text-anchor="middle"
    x="169"
    y="524"
