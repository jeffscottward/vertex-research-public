  </text>

  <line
    marker-end="url(#arr-gold)"
    stroke="#d4af37"
    stroke-width="3"
    x1="570"
    x2="618"
    y1="555"
    y2="555"
  />

  <!-- Node 3: price_freshness_state monitor -->
  <rect
    fill="#0f1115"
    height="114"
    rx="10"
    stroke="#58a6ff"
    width="230"
    x="626"
    y="498"
  />
  <text
    fill="#e6edf3"
    font-size="14"
    font-weight="700"
    text-anchor="middle"
    x="741"
    y="524"
  >
    Incident State Outbox
  </text>
  <text fill="#9aa3ad" font-size="12" text-anchor="middle" x="741" y="548">
