  </text>

  <line
    marker-end="url(#arr-green)"
    stroke="#7ee787"
    stroke-width="3"
    x1="856"
    x2="904"
    y1="555"
    y2="555"
  />

  <!-- Node 4: QuantVPS timer -> ntfy / fallback -->
  <rect
    fill="#0f1115"
    height="114"
    rx="10"
    stroke="#7ee787"
    width="224"
    x="912"
    y="498"
  />
  <text
    fill="#e6edf3"
    font-size="14"
    font-weight="700"
    text-anchor="middle"
    x="1024"
    y="524"
  >
    QuantVPS 15m Timer
  </text>
  <text fill="#7ee787" font-size="12" text-anchor="middle" x="1024" y="548">
    1. sendPriceAlertsNtfy
  </text>
  <text fill="#9aa3ad" font-size="12" text-anchor="middle" x="1024" y="568">
    2. #omp-alerts fallback
  </text>
  <text fill="#7ee787" font-size="11" text-anchor="middle" x="1024" y="592">
    Clears + notifies on recovery
  </text>
