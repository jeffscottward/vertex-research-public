    cx="124"
    cy="356"
    fill="none"
    r="24"
    stroke="#ff7b72"
    stroke-dasharray="6 5"
    stroke-width="4"
  />
  <line
    stroke="#ff7b72"
    stroke-linecap="round"
    stroke-width="4"
    x1="124"
    x2="124"
    y1="344"
    y2="358"
  />
  <line
    stroke="#ff7b72"
    stroke-linecap="round"
    stroke-width="4"
    x1="124"
    x2="136"
    y1="358"
    y2="364"
  />
  <text fill="#e6edf3" font-size="15" font-weight="600" x="200" y="348">
