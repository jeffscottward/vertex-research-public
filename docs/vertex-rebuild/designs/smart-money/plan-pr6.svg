    Max-Age Registries
  </text>
  <text fill="#9aa3ad" font-size="12" text-anchor="middle" x="169" y="548">
    OPENBB_JOB_METADATA
  </text>
  <text fill="#9aa3ad" font-size="12" text-anchor="middle" x="169" y="568">
    FLOW_SOURCE_METADATA
  </text>
  <text fill="#7ee787" font-size="11" text-anchor="middle" x="169" y="592">
