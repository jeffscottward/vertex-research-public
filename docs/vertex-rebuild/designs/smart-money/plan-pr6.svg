<svg
  aria-labelledby="title"
  font-family="DejaVu Sans, sans-serif"
  height="680"
  role="img"
  viewBox="0 0 1200 680"
  width="1200"
  xmlns="http://www.w3.org/2000/svg"
>
  <title id="title">
    PR 6: Smart money page, stock filings sections, and overdue alerting —
    before vs after
  </title>
  <defs>
    <marker
      id="arr-gold"
      markerHeight="7"
      markerWidth="7"
      orient="auto"
      refX="9"
      refY="5"
      viewBox="0 0 10 10"
    >
      <path d="M0,0 L10,5 L0,10 z" fill="#d4af37" />
    </marker>
    <marker
      id="arr-green"
      markerHeight="7"
      markerWidth="7"
      orient="auto"
      refX="9"
      refY="5"
      viewBox="0 0 10 10"
    >
      <path d="M0,0 L10,5 L0,10 z" fill="#7ee787" />
    </marker>
  </defs>

  <rect fill="#0f1115" height="680" width="1200" />
  <text fill="#f5f5f5" font-size="26" font-weight="700" x="40" y="48">
    Smart money PR 6: unified lists, stock filings tab, overdue alerts
  </text>
  <text fill="#9aa3ad" font-size="15" x="40" y="76">
