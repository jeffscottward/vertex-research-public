<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="620"
  viewBox="0 0 1200 620"
  font-family="DejaVu Sans, sans-serif"
  role="img"
  aria-labelledby="title"
>
  <title id="title">
    PR 5: 13F full books and FINRA short volume, before vs after
  </title>
  <defs>
    <marker
      id="arr"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto"
    >
      <path d="M0,0 L10,5 L0,10 z" fill="#d4af37" />
    </marker>
  </defs>
  <rect width="1200" height="620" fill="#0f1115" />
  <text x="40" y="50" fill="#f5f5f5" font-size="26" font-weight="700">
    PR 5: 13F full books + FINRA short volume
  </text>
  <text x="40" y="78" fill="#9aa3ad" font-size="15">
    Public SEC and FINRA data. $0 new spend. Measured 2026-11-20.
  </text>

  <!-- BEFORE -->
  <rect
    x="40"
    y="100"
    width="520"
    height="300"
    rx="14"
    fill="#171a21"
    stroke="#3a3f4a"
  />
  <text x="64" y="134" fill="#ff7b72" font-size="20" font-weight="700">
    BEFORE
  </text>
  <g fill="#6b7280">
    <rect x="70" y="160" width="26" height="70" />
    <rect x="102" y="185" width="26" height="45" />
    <rect x="134" y="200" width="26" height="30" />
  </g>
  <text x="180" y="185" fill="#c9d1d9" font-size="16">
    13F: 6 filers, top 50 only
  </text>
  <text x="180" y="208" fill="#ff7b72" font-size="14">
    no change vs last quarter
  </text>
  <g fill="#6b7280">
    <circle cx="83" cy="280" r="9" />
    <circle cx="108" cy="280" r="9" />
    <circle cx="133" cy="280" r="9" />
  </g>
  <text x="180" y="275" fill="#c9d1d9" font-size="16">
    FINRA short volume: 17 symbols
  </text>
  <text x="180" y="298" fill="#ff7b72" font-size="14">
    of ~12,300 in the daily file
  </text>
  <text x="70" y="360" fill="#c9d1d9" font-size="16">
    Every run downloads every 13F filing again
  </text>

  <!-- arrow -->
  <line
    x1="570"
    y1="250"
    x2="628"
    y2="250"
    stroke="#d4af37"
    stroke-width="4"
    marker-end="url(#arr)"
  />

  <!-- AFTER -->
  <rect
    x="640"
    y="100"
    width="520"
    height="300"
    rx="14"
    fill="#171a21"
    stroke="#d4af37"
  />
  <text x="664" y="134" fill="#7ee787" font-size="20" font-weight="700">
    AFTER
  </text>
  <g fill="#7ee787">
    <rect x="670" y="160" width="12" height="70" />
    <rect x="686" y="175" width="12" height="55" />
    <rect x="702" y="150" width="12" height="80" />
    <rect x="718" y="190" width="12" height="40" />
    <rect x="734" y="170" width="12" height="60" />
  </g>
  <text x="770" y="185" fill="#c9d1d9" font-size="16">
    13F: 23 filers, full books
  </text>
  <text x="770" y="208" fill="#7ee787" font-size="14">
    new / added / reduced / sold per filer
  </text>
  <g fill="#7ee787">
    <circle cx="676" cy="268" r="6" />
    <circle cx="694" cy="268" r="6" />
    <circle cx="712" cy="268" r="6" />
    <circle cx="730" cy="268" r="6" />
    <circle cx="676" cy="288" r="6" />
    <circle cx="694" cy="288" r="6" />
    <circle cx="712" cy="288" r="6" />
    <circle cx="730" cy="288" r="6" />
  </g>
  <text x="770" y="275" fill="#c9d1d9" font-size="16">
    FINRA short volume: every symbol
  </text>
  <text x="770" y="298" fill="#7ee787" font-size="14">
    ~12,300 a day, 5-day window
  </text>
  <text x="670" y="360" fill="#c9d1d9" font-size="16">
    Ledger: each filing fetched once, then skipped
  </text>

  <!-- FLOW -->
  <text x="40" y="450" fill="#f5f5f5" font-size="18" font-weight="700">
    Data flow
  </text>
  <g font-size="14" fill="#c9d1d9">
    <rect
      x="40"
      y="470"
      width="190"
      height="56"
      rx="10"
      fill="#1f2430"
      stroke="#3a3f4a"
    />
    <text x="56" y="495">SEC EDGAR 13F-HR</text>
    <text x="56" y="514" fill="#9aa3ad">+ FTD files (CUSIP map)</text>
    <rect
      x="290"
      y="470"
      width="190"
      height="56"
      rx="10"
      fill="#1f2430"
      stroke="#3a3f4a"
    />
    <text x="306" y="495">rig: sec-13f, sec-ftd</text>
    <text x="306" y="514" fill="#9aa3ad">skip list from ledger</text>
    <rect
      x="540"
      y="470"
      width="190"
      height="56"
      rx="10"
      fill="#1f2430"
      stroke="#3a3f4a"
    />
    <text x="556" y="495">openbb.ingest</text>
    <text x="556" y="514" fill="#9aa3ad">ledger only if book full</text>
    <rect
      x="790"
      y="470"
      width="170"
      height="56"
      rx="10"
      fill="#1f2430"
      stroke="#3a3f4a"
    />
    <text x="806" y="495">Postgres</text>
    <text x="806" y="514" fill="#9aa3ad">holdings, ledger, map</text>
    <rect
      x="1010"
      y="470"
      width="150"
      height="56"
      rx="10"
      fill="#1f2430"
      stroke="#d4af37"
    />
    <text x="1026" y="495">stock tab</text>
    <text x="1026" y="514" fill="#9aa3ad">+ MCP openbb_sec</text>
  </g>
  <g stroke="#d4af37" stroke-width="3">
    <line x1="232" y1="498" x2="286" y2="498" marker-end="url(#arr)" />
    <line x1="482" y1="498" x2="536" y2="498" marker-end="url(#arr)" />
    <line x1="732" y1="498" x2="786" y2="498" marker-end="url(#arr)" />
    <line x1="962" y1="498" x2="1006" y2="498" marker-end="url(#arr)" />
  </g>
  <text x="40" y="580" fill="#9aa3ad" font-size="14">
    Measured: ~86,800 13F entries per quarter (23 filers) → ≤ 0.35M rows/year;
    FINRA ~3.1M rows/year. Research only.
  </text>
</svg>
