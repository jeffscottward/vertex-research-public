    <path d="M704 200 L744 200" stroke="#6b8afd" stroke-width="3" />
    <path
      d="M738 193 L748 200 L738 207"
      fill="none"
      stroke="#6b8afd"
      stroke-width="3"
    />
    <circle
      cx="776"
      cy="200"
      r="24"
      fill="none"
      stroke="#e8e6e1"
      stroke-width="3"
    />
    <path
      d="M776 186 L776 200 L787 207"
      stroke="#e8e6e1"
      stroke-width="3"
      fill="none"
      stroke-linecap="round"
    />
