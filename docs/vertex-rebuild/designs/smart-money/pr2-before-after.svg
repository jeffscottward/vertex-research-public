<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="560"
  viewBox="0 0 1200 560"
  font-family="Public Sans, Manrope, sans-serif"
  role="img"
  aria-labelledby="pr2-title"
>
  <title id="pr2-title">
    PR 2 before and after: market-wide large options premium
  </title>
  <rect width="1200" height="560" fill="#0f1115" />
  <text x="40" y="52" fill="#e8e6e1" font-size="28" font-weight="700">
    PR 2: market-wide large options premium
  </text>
  <text x="40" y="82" fill="#9a9a9a" font-size="16">
    Each trade ≥ $100,000 · QuantData gainers-losers (already paid) · research
    only
  </text>
  <text x="1160" y="52" fill="#c9a227" font-size="14" text-anchor="end">
    MOCK bars: illustrative values
  </text>

  <!-- BEFORE -->
  <rect
    x="40"
    y="110"
    width="440"
    height="410"
    rx="18"
    fill="#171a21"
    stroke="#2a2f3a"
  />
  <text x="70" y="150" fill="#9a9a9a" font-size="20" font-weight="700">
    BEFORE
  </text>
  <g font-size="18" font-weight="700" fill="#cfcfcf">
    <rect x="80" y="190" width="80" height="44" rx="10" fill="#232835" />
    <text x="120" y="219" text-anchor="middle">SPY</text>
    <rect x="175" y="190" width="80" height="44" rx="10" fill="#232835" />
    <text x="215" y="219" text-anchor="middle">SPX</text>
    <rect x="270" y="190" width="80" height="44" rx="10" fill="#232835" />
    <text x="310" y="219" text-anchor="middle">QQQ</text>
    <rect x="365" y="190" width="80" height="44" rx="10" fill="#232835" />
    <text x="405" y="219" text-anchor="middle">NDX</text>
  </g>
  <text x="260" y="265" fill="#9a9a9a" font-size="15" text-anchor="middle">
    option prints for 4 index products only
  </text>
  <!-- empty market grid with question mark -->
  <g opacity="0.55">
    <g fill="#232835">
      <rect x="110" y="300" width="36" height="36" rx="6" />
      <rect x="152" y="300" width="36" height="36" rx="6" />
      <rect x="194" y="300" width="36" height="36" rx="6" />
      <rect x="236" y="300" width="36" height="36" rx="6" />
      <rect x="278" y="300" width="36" height="36" rx="6" />
      <rect x="320" y="300" width="36" height="36" rx="6" />
      <rect x="362" y="300" width="36" height="36" rx="6" />
      <rect x="110" y="342" width="36" height="36" rx="6" />
      <rect x="152" y="342" width="36" height="36" rx="6" />
      <rect x="194" y="342" width="36" height="36" rx="6" />
      <rect x="236" y="342" width="36" height="36" rx="6" />
      <rect x="278" y="342" width="36" height="36" rx="6" />
      <rect x="320" y="342" width="36" height="36" rx="6" />
      <rect x="362" y="342" width="36" height="36" rx="6" />
      <rect x="110" y="384" width="36" height="36" rx="6" />
      <rect x="152" y="384" width="36" height="36" rx="6" />
      <rect x="194" y="384" width="36" height="36" rx="6" />
      <rect x="236" y="384" width="36" height="36" rx="6" />
      <rect x="278" y="384" width="36" height="36" rx="6" />
      <rect x="320" y="384" width="36" height="36" rx="6" />
      <rect x="362" y="384" width="36" height="36" rx="6" />
    </g>
  </g>
  <circle
    cx="254"
    cy="360"
    r="44"
    fill="#0f1115"
    stroke="#d4574a"
    stroke-width="4"
  />
  <text
    x="254"
    y="378"
    fill="#d4574a"
    font-size="52"
    font-weight="700"
    text-anchor="middle"
  >
    ?
  </text>
  <text x="260" y="470" fill="#cfcfcf" font-size="17" text-anchor="middle">
    ~4,000 other tickers: no view
  </text>
  <text x="260" y="496" fill="#9a9a9a" font-size="15" text-anchor="middle">
    no history stored
  </text>

  <!-- arrow -->
  <path
    d="M500 315 L560 315"
    stroke="#c9a227"
    stroke-width="6"
    stroke-linecap="round"
  />
  <path
    d="M552 300 L572 315 L552 330"
    fill="none"
    stroke="#c9a227"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- AFTER -->
  <rect
    x="590"
    y="110"
    width="570"
    height="410"
    rx="18"
    fill="#171a21"
    stroke="#c9a227"
    stroke-opacity="0.6"
  />
  <text x="620" y="150" fill="#c9a227" font-size="20" font-weight="700">
