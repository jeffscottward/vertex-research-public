    </text>
    <g fill="#c9a227">
      <rect x="960" y="192" width="10" height="22" rx="2" opacity="0.35" />
      <rect x="974" y="192" width="10" height="22" rx="2" opacity="0.45" />
      <rect x="988" y="192" width="10" height="22" rx="2" opacity="0.55" />
      <rect x="1002" y="192" width="10" height="22" rx="2" opacity="0.6" />
      <rect x="1016" y="192" width="10" height="22" rx="2" opacity="0.7" />
      <rect x="1030" y="192" width="10" height="22" rx="2" opacity="0.75" />
      <rect x="1044" y="192" width="10" height="22" rx="2" opacity="0.8" />
      <rect x="1058" y="192" width="10" height="22" rx="2" opacity="0.85" />
      <rect x="1072" y="192" width="10" height="22" rx="2" opacity="0.9" />
      <rect x="1086" y="192" width="10" height="22" rx="2" opacity="0.95" />
      <rect x="1100" y="192" width="10" height="22" rx="2" />
      <rect x="1114" y="192" width="10" height="22" rx="2" />
    </g>
    <text x="960" y="234" fill="#9a9a9a" font-size="13">~250 sessions</text>
  </g>
  <!-- ranking bars -->
  <line x1="760" y1="270" x2="760" y2="442" stroke="#3a3f4a" stroke-width="2" />
  <g font-size="15" font-weight="700" fill="#e8e6e1">
    <text x="745" y="292" text-anchor="end">AAA</text>
    <rect x="762" y="278" width="300" height="20" rx="4" fill="#3fb37f" />
    <text x="745" y="326" text-anchor="end">BBB</text>
    <rect x="762" y="312" width="220" height="20" rx="4" fill="#3fb37f" />
    <text x="745" y="360" text-anchor="end">CCC</text>
    <rect x="762" y="346" width="150" height="20" rx="4" fill="#3fb37f" />
    <text x="745" y="394" text-anchor="end">DDD</text>
    <rect x="762" y="380" width="80" height="20" rx="4" fill="#3fb37f" />
    <text x="772" y="429">EEE</text>
    <rect x="678" y="414" width="80" height="20" rx="4" fill="#d4574a" />
  </g>
  <g font-size="14" fill="#9a9a9a">
    <text x="1075" y="293">net bullish</text>
    <text x="718" y="452" text-anchor="middle">net bearish</text>
  </g>
  <text x="875" y="470" fill="#cfcfcf" font-size="16" text-anchor="middle">
    /smart-money · MCP openbb_smart_money_ranking
  </text>
  <text x="875" y="496" fill="#9a9a9a" font-size="14" text-anchor="middle">
    capture time + "QuantData, intraday" on every answer
  </text>
</svg>
