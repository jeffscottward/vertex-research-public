<svg
  xmlns="http://www.w3.org/2000/svg"
  width="960"
  height="460"
  viewBox="0 0 960 460"
  font-family="Public Sans, Manrope, sans-serif"
>
  <rect width="960" height="460" fill="#111317" />
  <text x="40" y="44" fill="#f2f2f2" font-size="22" font-weight="700">
    Flow reads by New York time
  </text>
  <text x="40" y="68" fill="#9aa0a6" font-size="14">
    Options, GEX, net drift and the SPY tape. Research data only; no orders.
  </text>

  <!-- hour axis 04:00 .. 20:00 mapped to x 200..920 (45 px per hour) -->
  <g fill="#9aa0a6" font-size="12" text-anchor="middle">
    <text x="200" y="100">04:00</text>
    <text x="447" y="100">09:30</text>
    <text x="605" y="100">13:00</text>
    <text x="740" y="100">16:00</text>
    <text x="785" y="100">17:00</text>
    <text x="920" y="100">20:00</text>
  </g>
  <g stroke="#2c3036" stroke-width="1">
    <line x1="447" y1="108" x2="447" y2="430" />
    <line x1="605" y1="108" x2="605" y2="430" />
    <line x1="740" y1="108" x2="740" y2="430" />
    <line x1="785" y1="108" x2="785" y2="430" />
  </g>

  <!-- BEFORE -->
  <text x="40" y="140" fill="#e0b84a" font-size="16" font-weight="700">
    BEFORE
  </text>
  <text x="40" y="172" fill="#d0d0d0" font-size="14">Holiday</text>
  <text x="40" y="188" fill="#9aa0a6" font-size="11">2026-11-26</text>
  <rect x="447" y="164" width="304" height="12" rx="6" fill="#c0504d" />
  <rect
    x="200"
    y="182"
    width="720"
    height="8"
    rx="4"
    fill="#c0504d"
    opacity="0.7"
  />
  <text x="760" y="174" fill="#f28b82" font-size="12">
    ✕ reads on a closed market
  </text>

  <text x="40" y="232" fill="#d0d0d0" font-size="14">Early close</text>
  <text x="40" y="248" fill="#9aa0a6" font-size="11">2026-11-27</text>
  <rect x="447" y="224" width="169" height="12" rx="6" fill="#4caf7a" />
  <rect x="616" y="224" width="135" height="12" rx="6" fill="#c0504d" />
  <rect
    x="200"
    y="242"
    width="585"
    height="8"
    rx="4"
    fill="#4caf7a"
    opacity="0.7"
  />
  <rect
    x="785"
    y="242"
    width="135"
    height="8"
    rx="4"
    fill="#c0504d"
    opacity="0.7"
  />

  <!-- AFTER -->
  <text x="40" y="300" fill="#e0b84a" font-size="16" font-weight="700">
    AFTER
  </text>
  <text x="40" y="332" fill="#d0d0d0" font-size="14">Holiday</text>
  <text x="40" y="348" fill="#9aa0a6" font-size="11">2026-11-26</text>
  <rect
    x="200"
    y="326"
    width="720"
    height="16"
    rx="8"
    fill="none"
    stroke="#4a4f57"
    stroke-dasharray="6 5"
  />
  <text x="560" y="339" fill="#9aa0a6" font-size="12" text-anchor="middle">
    closed: no reads, /flow shows the last trading session
  </text>

  <text x="40" y="392" fill="#d0d0d0" font-size="14">Early close</text>
  <text x="40" y="408" fill="#9aa0a6" font-size="11">2026-11-27</text>
  <rect x="447" y="384" width="169" height="12" rx="6" fill="#4caf7a" />
  <rect
    x="200"
    y="402"
    width="585"
    height="8"
    rx="4"
    fill="#4caf7a"
    opacity="0.7"
  />
  <text x="800" y="400" fill="#81c995" font-size="12">✓ ends 3 h early</text>

  <!-- legend -->
  <rect x="200" y="436" width="22" height="10" rx="5" fill="#4caf7a" />
  <text x="228" y="445" fill="#9aa0a6" font-size="11">reads with data</text>
  <rect x="340" y="436" width="22" height="10" rx="5" fill="#c0504d" />
  <text x="368" y="445" fill="#9aa0a6" font-size="11">wasted reads</text>
  <text x="470" y="445" fill="#9aa0a6" font-size="11">
    thick bar: options, GEX, net drift · thin bar: SPY tape (extended hours) ·
    ES/NQ futures unchanged
  </text>
</svg>
