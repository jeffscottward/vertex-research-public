<svg
  aria-label="Before and after comparison for Expected Move Bands on the price chart (MOCK)"
  font-family="DejaVu Sans, system-ui, sans-serif"
  height="440"
  role="img"
  viewBox="0 0 960 440"
  width="960"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient id="coneFill" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#d4a72c" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#d4a72c" stop-opacity="0.10" />
    </linearGradient>
    <marker
      id="arrowGold"
      markerHeight="7"
      markerWidth="7"
      orient="auto"
      refX="8"
      refY="5"
      viewBox="0 0 10 10"
    >
      <path d="M0,1 L8,5 L0,9 Z" fill="#d4a72c" />
    </marker>
  </defs>

  <!-- Canvas background -->
  <rect fill="#0d1117" height="440" rx="12" width="960" />

  <!-- Header -->
  <text fill="#f0f6fc" font-size="18" font-weight="700" x="28" y="36">
    Expected Move Bands (ATM Straddle) — O21
  </text>
  <text fill="#8b949e" font-size="12" x="28" y="56">
    Per-expiry ±1σ volatility cone drawn forward on the price chart · Research
    view only
  </text>
  <rect
    fill="#3a2e08"
    height="24"
    rx="5"
    stroke="#d4a72c"
    stroke-width="1"
    width="78"
    x="854"
    y="18"
  />
  <text
    fill="#f2cc60"
    font-size="11"
    font-weight="700"
    text-anchor="middle"
    x="893"
    y="34"
  >
    MOCK
  </text>

  <!-- BEFORE Panel -->
  <rect
    fill="#161b22"
    height="334"
    rx="10"
    stroke="#30363d"
    stroke-width="1"
    width="420"
    x="28"
    y="76"
  />
  <rect
    fill="#21262d"
    height="22"
    rx="4"
    stroke="#484f58"
    width="72"
    x="44"
    y="92"
  />
  <text
    fill="#c9d1d9"
    font-size="11"
    font-weight="700"
    text-anchor="middle"
    x="80"
    y="107"
  >
    BEFORE
  </text>
  <text fill="#8b949e" font-size="12" x="128" y="107">
    Price candles stop at today — no move cone
  </text>

  <!-- Before Chart Grid -->
  <g stroke="#21262d" stroke-width="1">
    <line x1="50" x2="426" y1="150" y2="150" />
    <line x1="50" x2="426" y1="205" y2="205" />
    <line x1="50" x2="426" y1="260" y2="260" />
    <line x1="50" x2="426" y1="315" y2="315" />
    <line x1="50" x2="426" y1="362" y2="362" />
  </g>
  <!-- Before Candles -->
  <g stroke-width="1.5">
    <line stroke="#8b949e" x1="76" x2="76" y1="268" y2="294" />
    <rect fill="#8b949e" height="14" width="10" x="71" y="274" />
    <line stroke="#e6edf3" x1="106" x2="106" y1="255" y2="282" />
    <rect fill="#e6edf3" height="16" width="10" x="101" y="260" />
    <line stroke="#e6edf3" x1="136" x2="136" y1="248" y2="275" />
    <rect fill="#e6edf3" height="14" width="10" x="131" y="253" />
    <line stroke="#8b949e" x1="166" x2="166" y1="252" y2="284" />
    <rect fill="#8b949e" height="18" width="10" x="161" y="258" />
    <line stroke="#e6edf3" x1="196" x2="196" y1="242" y2="270" />
    <rect fill="#e6edf3" height="16" width="10" x="191" y="246" />
    <line stroke="#e6edf3" x1="226" x2="226" y1="230" y2="258" />
    <rect fill="#e6edf3" height="14" width="10" x="221" y="236" />
    <line stroke="#8b949e" x1="256" x2="256" y1="236" y2="264" />
    <rect fill="#8b949e" height="14" width="10" x="251" y="242" />
    <line stroke="#e6edf3" x1="286" x2="286" y1="225" y2="252" />
    <rect fill="#e6edf3" height="15" width="10" x="281" y="230" />
    <line stroke="#e6edf3" x1="316" x2="316" y1="222" y2="246" />
    <rect fill="#e6edf3" height="13" width="10" x="311" y="226" />
  </g>
  <!-- Empty right region with question mark -->
  <rect
    fill="#0d1117"
    fill-opacity="0.55"
    height="218"
    rx="6"
    stroke="#30363d"
    stroke-dasharray="4,4"
    width="88"
    x="334"
    y="142"
  />
  <text
    fill="#6e7681"
    font-size="28"
    font-weight="700"
    text-anchor="middle"
    x="378"
    y="248"
  >
    ?
  </text>
  <text fill="#6e7681" font-size="10" text-anchor="middle" x="378" y="270">
    No expiry range
  </text>
  <text fill="#8b949e" font-size="11" text-anchor="middle" x="238" y="392">
    Operator must calculate ATM straddle off-chart
  </text>

  <!-- Center Arrow -->
  <line
    marker-end="url(#arrowGold)"
    stroke="#d4a72c"
    stroke-width="2.5"
    x1="458"
    x2="498"
    y1="244"
    y2="244"
  />

  <!-- AFTER Panel -->
  <rect
    fill="#161b22"
    height="334"
    rx="10"
    stroke="#d4a72c"
    stroke-width="1.2"
    width="424"
    x="508"
    y="76"
  />
  <rect
    fill="#3a2e08"
    height="22"
    rx="4"
    stroke="#d4a72c"
    width="66"
    x="524"
    y="92"
  />
  <text
    fill="#f2cc60"
    font-size="11"
    font-weight="700"
    text-anchor="middle"
    x="557"
    y="107"
  >
    AFTER
  </text>
  <!-- Mini Expiry Pill & Summary -->
  <rect
    fill="#21262d"
    height="22"
    rx="4"
    stroke="#484f58"
    width="122"
    x="602"
    y="92"
  />
  <text fill="#f0f6fc" font-size="10.5" text-anchor="middle" x="663" y="107">
    2026-12-18 (25 DTE) ▾
  </text>
  <rect
    fill="#1f2937"
    height="22"
    rx="4"
    stroke="#30363d"
    width="184"
    x="732"
    y="92"
  />
  <text
    fill="#f2cc60"
    font-size="10"
    font-weight="600"
    text-anchor="middle"
    x="824"
    y="107"
  >
    ±1σ $25.60 · Straddle $20.43
  </text>

  <!-- After Chart Grid -->
  <g stroke="#21262d" stroke-width="1">
    <line x1="530" x2="910" y1="150" y2="150" />
    <line x1="530" x2="910" y1="205" y2="205" />
    <line x1="530" x2="910" y1="260" y2="260" />
    <line x1="530" x2="910" y1="315" y2="315" />
    <line x1="530" x2="910" y1="362" y2="362" />
  </g>
  <!-- After Candles -->
  <g stroke-width="1.5">
    <line stroke="#8b949e" x1="552" x2="552" y1="268" y2="294" />
    <rect fill="#8b949e" height="14" width="10" x="547" y="274" />
    <line stroke="#e6edf3" x1="578" x2="578" y1="255" y2="282" />
    <rect fill="#e6edf3" height="16" width="10" x="573" y="260" />
    <line stroke="#e6edf3" x1="604" x2="604" y1="248" y2="275" />
    <rect fill="#e6edf3" height="14" width="10" x="599" y="253" />
    <line stroke="#8b949e" x1="630" x2="630" y1="252" y2="284" />
    <rect fill="#8b949e" height="18" width="10" x="625" y="258" />
    <line stroke="#e6edf3" x1="656" x2="656" y1="242" y2="270" />
    <rect fill="#e6edf3" height="16" width="10" x="651" y="246" />
    <line stroke="#e6edf3" x1="682" x2="682" y1="230" y2="258" />
    <rect fill="#e6edf3" height="14" width="10" x="677" y="236" />
    <line stroke="#e6edf3" x1="708" x2="708" y1="224" y2="248" />
    <rect fill="#e6edf3" height="13" width="10" x="703" y="229" />
  </g>

  <!-- Square-root-of-time Expected Move Cone from (713, 232) to x=862, upper=154, lower=310 -->
  <path
    d="M 713 232 Q 752 178, 862 154 L 862 310 Q 752 286, 713 232 Z"
    fill="url(#coneFill)"
  />
  <!-- +1 sigma upper curve -->
  <path
    d="M 713 232 Q 752 178, 862 154"
    fill="none"
    stroke="#d4a72c"
    stroke-dasharray="5,4"
    stroke-width="2"
  />
  <!-- -1 sigma lower curve -->
  <path
    d="M 713 232 Q 752 286, 862 310"
    fill="none"
    stroke="#d4a72c"
    stroke-dasharray="5,4"
    stroke-width="2"
  />
  <!-- Spot center dashed line -->
  <line
    stroke="#6e7681"
    stroke-dasharray="2,3"
    stroke-width="1"
    x1="713"
    x2="862"
    y1="232"
    y2="232"
  />
  <!-- Expiry vertical guide -->
  <line
    stroke="#8b949e"
    stroke-dasharray="2,3"
    stroke-width="1"
    x1="862"
    x2="862"
    y1="154"
    y2="310"
  />
  <!-- Inner straddle breakeven ticks at expiry -->
  <line stroke="#79c0ff" stroke-width="2" x1="854" x2="870" y1="170" y2="170" />
  <line stroke="#79c0ff" stroke-width="2" x1="854" x2="870" y1="294" y2="294" />
  <!-- Spot dot -->
  <circle cx="713" cy="232" fill="#f2cc60" r="3.5" />

  <!-- Pill labels at expiry -->
  <rect
    fill="#0d1117"
    height="18"
    rx="3"
    stroke="#d4a72c"
    stroke-width="1"
    width="94"
    x="814"
    y="132"
  />
  <text
    fill="#f2cc60"
    font-size="9.5"
    font-weight="700"
    text-anchor="middle"
    x="861"
    y="144"
  >
    +1σ $625.60
  </text>
  <rect
    fill="#0d1117"
    height="18"
    rx="3"
    stroke="#d4a72c"
    stroke-width="1"
    width="94"
    x="814"
    y="314"
  />
  <text
    fill="#f2cc60"
    font-size="9.5"
    font-weight="700"
    text-anchor="middle"
    x="861"
    y="326"
  >
    -1σ $574.40
  </text>
  <text fill="#79c0ff" font-size="9" x="875" y="173">BE+</text>
  <text fill="#79c0ff" font-size="9" x="875" y="297">BE-</text>
  <text fill="#8b949e" font-size="9.5" text-anchor="middle" x="862" y="348">
    12-18 (25d)
  </text>

  <!-- Basis badge bottom -->
  <text fill="#c9d1d9" font-size="11" text-anchor="middle" x="720" y="392">
    /charts + /stock · Basis: ATM straddle mid · Dark &amp; Light
  </text>
</svg>
