<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 960 360"
  width="960"
  height="360"
  role="img"
  aria-labelledby="t d"
>
  <title id="t">Before and after: prediction-market calibration data</title>
  <desc id="d">
    Before: a 36 GB archive with Kalshi data is blocked by terms. After: public
    Polygon blocks flow through a decoder into local Parquet files, a DuckDB
    reader and a text calibration report.
  </desc>
  <rect width="960" height="360" fill="#111418" />
  <text x="40" y="44" fill="#9aa4af" font-family="sans-serif" font-size="18">
    BEFORE
  </text>
  <text x="430" y="44" fill="#d4b26a" font-family="sans-serif" font-size="18">
    AFTER
  </text>
  <line x1="390" y1="30" x2="390" y2="330" stroke="#2a3038" stroke-width="2" />
  <!-- before: archive box with lock and cross -->
  <g transform="translate(90,90)">
    <rect
      x="0"
      y="30"
      width="200"
      height="140"
      rx="10"
      fill="#1d232b"
      stroke="#4a5563"
      stroke-width="3"
    />
    <rect
      x="-10"
      y="10"
      width="220"
      height="34"
      rx="6"
      fill="#262e38"
      stroke="#4a5563"
      stroke-width="3"
    />
    <text
      x="100"
      y="110"
      text-anchor="middle"
      fill="#c9d1d9"
      font-family="sans-serif"
      font-size="30"
    >
      36 GB
    </text>
    <rect x="78" y="128" width="44" height="32" rx="4" fill="#3a4350" />
    <path
      d="M86 128 v-10 a14 14 0 0 1 28 0 v10"
      fill="none"
      stroke="#3a4350"
      stroke-width="6"
    />
    <line
      x1="-20"
      y1="0"
      x2="230"
      y2="200"
      stroke="#e5534b"
      stroke-width="8"
      stroke-linecap="round"
    />
    <line
      x1="230"
      y1="0"
      x2="-20"
      y2="200"
      stroke="#e5534b"
      stroke-width="8"
      stroke-linecap="round"
    />
  </g>
  <!-- after: chain blocks -->
  <g
    transform="translate(420,120)"
    fill="#1d232b"
    stroke="#d4b26a"
    stroke-width="3"
  >
    <rect x="0" y="0" width="44" height="44" rx="6" />
    <rect x="0" y="60" width="44" height="44" rx="6" />
    <rect x="0" y="120" width="44" height="44" rx="6" />
    <line x1="22" y1="44" x2="22" y2="60" />
    <line x1="22" y1="104" x2="22" y2="120" />
  </g>
  <text
    x="442"
    y="310"
    text-anchor="middle"
    fill="#9aa4af"
    font-family="sans-serif"
    font-size="14"
  >
    Polygon
  </text>
  <!-- arrow -->
  <g stroke="#d4b26a" stroke-width="4" fill="#d4b26a">
    <line x1="480" y1="202" x2="548" y2="202" />
    <path d="M548 192 l16 10 l-16 10 z" />
    <line x1="660" y1="202" x2="708" y2="202" />
    <path d="M708 192 l16 10 l-16 10 z" />
  </g>
  <!-- funnel decoder -->
  <path
    d="M572 150 h80 l-28 52 v40 h-24 v-40 z"
    fill="#262e38"
    stroke="#d4b26a"
    stroke-width="3"
  />
  <!-- parquet file + chart -->
  <g transform="translate(736,140)">
    <path
      d="M0 0 h60 l24 24 v100 h-84 z"
      fill="#1d232b"
      stroke="#c9d1d9"
      stroke-width="3"
    />
    <g fill="#d4b26a">
      <rect x="12" y="40" width="60" height="8" />
      <rect x="12" y="58" width="60" height="8" />
      <rect x="12" y="76" width="60" height="8" />
      <rect x="12" y="94" width="60" height="8" />
    </g>
  </g>
  <g
    transform="translate(850,140)"
    stroke="#c9d1d9"
    stroke-width="3"
    fill="none"
  >
    <line x1="0" y1="124" x2="80" y2="124" />
    <line x1="0" y1="124" x2="0" y2="20" />
    <line
      x1="0"
      y1="124"
      x2="80"
      y2="30"
      stroke="#4a5563"
      stroke-dasharray="6 6"
    />
    <polyline points="4,118 20,104 36,86 52,64 68,46 78,34" stroke="#d4b26a" />
  </g>
  <text
    x="778"
    y="300"
    text-anchor="middle"
    fill="#9aa4af"
    font-family="sans-serif"
    font-size="14"
  >
    Parquet + DuckDB
  </text>
  <text
    x="890"
    y="300"
    text-anchor="middle"
    fill="#9aa4af"
    font-family="sans-serif"
    font-size="14"
  >
    calibration
  </text>
</svg>
