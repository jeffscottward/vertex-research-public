<?xml version="1.0" encoding="UTF-8" ?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="540"
  viewBox="0 0 1200 540"
  font-family="Helvetica, Arial, sans-serif"
>
  <title>
    Before and after: two research modules move from an unpushed private branch
    into this repository and its CI
  </title>
  <rect width="1200" height="540" fill="#0f1115" />
  <text x="60" y="56" fill="#f5f5f5" font-size="26" font-weight="700">
    Two research modules: from a private branch to this repository
  </text>

  <!-- BEFORE -->
  <text
    x="60"
    y="108"
    fill="#9aa0a6"
    font-size="18"
    font-weight="700"
    letter-spacing="3"
  >
    BEFORE
  </text>
  <rect
    x="60"
    y="124"
    width="440"
    height="356"
    rx="18"
    fill="#171a20"
    stroke="#3a3f47"
    stroke-width="2"
    stroke-dasharray="10 8"
  />
  <!-- lock -->
  <g
    transform="translate(96,156)"
    stroke="#9aa0a6"
    stroke-width="4"
    fill="none"
  >
    <path d="M10 26 V16 a14 14 0 0 1 28 0 V26" />
    <rect x="2" y="26" width="44" height="34" rx="6" fill="#23272e" />
    <circle cx="24" cy="43" r="4" fill="#9aa0a6" stroke="none" />
  </g>
  <text x="160" y="182" fill="#e8eaed" font-size="19" font-weight="700">
    private backup repository
  </text>
  <text x="160" y="208" fill="#9aa0a6" font-size="16">
    branch ws/repos-reel, 6 commits, not pushed
  </text>
  <!-- module chips -->
  <g transform="translate(96,246)">
    <rect
      width="170"
      height="110"
      rx="14"
      fill="#23272e"
      stroke="#5f6368"
      stroke-width="2"
    />
    <path
      d="M22 84 C52 80 62 30 148 24"
      stroke="#9aa0a6"
      stroke-width="4"
      fill="none"
    />
    <line
      x1="22"
      y1="84"
      x2="148"
      y2="24"
      stroke="#5f6368"
      stroke-width="2"
      stroke-dasharray="5 5"
    />
    <text x="85" y="104" fill="#9aa0a6" font-size="13" text-anchor="middle">
      calibration
    </text>
  </g>
  <g transform="translate(294,246)">
    <rect
      width="170"
      height="110"
      rx="14"
      fill="#23272e"
      stroke="#5f6368"
      stroke-width="2"
    />
    <g fill="#9aa0a6">
      <rect x="28" y="52" width="16" height="30" />
      <rect x="54" y="38" width="16" height="44" />
      <rect x="80" y="46" width="16" height="36" />
      <rect x="106" y="24" width="16" height="58" />
    </g>
    <path
      d="M128 22 l18 20 m0 0 l-2 -12 m2 12 l-12 -1"
      stroke="#9aa0a6"
      stroke-width="3"
      fill="none"
    />
    <text x="85" y="104" fill="#9aa0a6" font-size="13" text-anchor="middle">
      distribution days
    </text>
  </g>
  <!-- CI off -->
  <g transform="translate(96,392)">
    <circle
      cx="26"
      cy="26"
      r="24"
      fill="none"
      stroke="#5f6368"
      stroke-width="4"
    />
    <line x1="10" y1="42" x2="42" y2="10" stroke="#5f6368" stroke-width="4" />
    <text x="68" y="24" fill="#e8eaed" font-size="18" font-weight="700">
      CI runs 0 of their tests
    </text>
    <text x="68" y="48" fill="#9aa0a6" font-size="15">
      no pull request, no review in this repository
    </text>
  </g>

  <!-- arrow -->
  <g
    stroke="#d4af37"
    stroke-width="6"
    fill="none"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <line x1="530" y1="302" x2="650" y2="302" />
    <polyline points="626,278 652,302 626,326" />
  </g>
  <text x="591" y="268" fill="#d4af37" font-size="15" text-anchor="middle">
    one pull request
  </text>

  <!-- AFTER -->
  <text
    x="700"
    y="108"
    fill="#d4af37"
    font-size="18"
    font-weight="700"
    letter-spacing="3"
  >
    AFTER
  </text>
  <rect
    x="700"
    y="124"
    width="440"
    height="356"
    rx="18"
    fill="#171a20"
    stroke="#d4af37"
    stroke-width="2"
  />
  <!-- repo icon -->
  <g
    transform="translate(736,154)"
    stroke="#d4af37"
    stroke-width="4"
    fill="none"
  >
    <rect x="2" y="2" width="44" height="56" rx="6" fill="#23272e" />
    <line x1="14" y1="2" x2="14" y2="58" />
    <line x1="24" y1="18" x2="36" y2="18" />
    <line x1="24" y1="30" x2="36" y2="30" />
  </g>
  <text x="800" y="182" fill="#f5f5f5" font-size="19" font-weight="700">
    this repository
  </text>
  <text x="800" y="208" fill="#9aa0a6" font-size="16">
    services/research, MIT license files kept
  </text>
  <g transform="translate(736,246)">
    <rect
      width="170"
      height="110"
      rx="14"
      fill="#23272e"
      stroke="#d4af37"
      stroke-width="2"
    />
    <path
      d="M22 84 C52 80 62 30 148 24"
      stroke="#d4af37"
      stroke-width="4"
      fill="none"
    />
    <line
      x1="22"
      y1="84"
      x2="148"
      y2="24"
      stroke="#9aa0a6"
      stroke-width="2"
      stroke-dasharray="5 5"
    />
    <text x="85" y="104" fill="#e8eaed" font-size="13" text-anchor="middle">
      calibration, 11 tests
    </text>
  </g>
  <g transform="translate(934,246)">
    <rect
      width="170"
      height="110"
      rx="14"
      fill="#23272e"
      stroke="#d4af37"
      stroke-width="2"
    />
    <g fill="#d4af37">
      <rect x="28" y="52" width="16" height="30" />
      <rect x="54" y="38" width="16" height="44" />
      <rect x="80" y="46" width="16" height="36" />
      <rect x="106" y="24" width="16" height="58" />
    </g>
    <path
      d="M128 22 l18 20 m0 0 l-2 -12 m2 12 l-12 -1"
      stroke="#e8eaed"
      stroke-width="3"
      fill="none"
    />
    <text x="85" y="104" fill="#e8eaed" font-size="13" text-anchor="middle">
      distribution days, 11 tests
    </text>
  </g>
  <g transform="translate(736,392)">
    <circle
      cx="26"
      cy="26"
      r="24"
      fill="none"
      stroke="#34a853"
      stroke-width="4"
    />
    <polyline
      points="14,27 23,36 39,17"
      fill="none"
      stroke="#34a853"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <text x="68" y="24" fill="#f5f5f5" font-size="18" font-weight="700">
      CI runs all 22 tests
    </text>
    <text x="68" y="48" fill="#9aa0a6" font-size="15">
      no dataset, no new dependency, no order path
    </text>
  </g>
  <text x="60" y="518" fill="#9aa0a6" font-size="14">
    Research only. Test counts are from the local run of both test files on
    2026-11-15.
  </text>
</svg>
