packages:
  - "apps/*"
  - "packages/*"

# Pinned so every shell records the same pnpm workspace state. pnpm sets it to
# false when it detects CI (ci-info: CI=true, BUILD_ID and similar variables)
# and leaves it unset otherwise (both mean off), and `pnpm run`/`pnpm exec`
# reinstall when the recorded value differs. A shell with CI=true (agent
# shells) and one without would reinstall in turns (card
# vertex-prepush-api-task-serial-install, 2026-11-08).
enableGlobalVirtualStore: false

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
  # The desktop shell fetches its Electron binary on demand (`pnpm --filter
  # @darkfactory/desktop electron:install`), so CI installs never download it.
  electron: false
  '@scarf/scarf': false

overrides:
  "minimatch@10.2.5>brace-expansion": 5.0.12
  "@esbuild-kit/core-utils@3.3.2>esbuild": 0.25.12
  "@chevrotain/cst-dts-gen@10.5.0>lodash": 4.18.1
  "@chevrotain/gast@10.5.0>lodash": 4.18.1
  "chevrotain@10.5.0>lodash": 4.18.1
  "fast-uri@>=3.0.0 <3.1.7": ^3.1.7
  "fflate@>=0.7.0 <0.7.5": ^0.7.5
